<title>Fabula Arcana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Lexend:wght@400;500;600&family=Signika:wght@400;600&display=swap">
<style>
/* Layout: a camp card table seen at an angle. Opponent's three cards on top, yours at the bottom, the active card pushed forward with its monster standing on it as a hologram. Picker below, card detail + log on the right. */
:root{
  --ground:#1b2a26; --felt:#203a35; --felt2:#16292a; --ember:#e8914a;
  --win1:#2c4596; --win2:#121d52; --rim:#d7dcf0;
  --ink:#f3f1ea; --mute:#a9b3d6; --gold:#f4c95d; --hurt:#ff6f6f; --heal:#7ee29a; --holo:#7fe9ff;
  --parch:#efe2c4; --parch-ink:#2b2318; --wood:#6b5432;
  --e-phys:#cfc8b8; --e-air:#7fd88f; --e-bolt:#f5d547; --e-dark:#9a7ae6; --e-earth:#c9925a; --e-fire:#ff6a3d; --e-ice:#8fdcff; --e-light:#fff1a6; --e-poison:#d26fc0;
  --font-d:"Pixelify Sans","Courier New",monospace; --font-b:"Lexend",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 115%,#4a2c18 0%,var(--ground) 55%) fixed,var(--ground);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-d);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:2px solid var(--rim);border-radius:8px;box-shadow:0 0 0 2px #0a0f2a,0 6px 18px #0008;padding:12px 14px}
.label{font-family:var(--font-d);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 12px;max-width:1260px}
.top h1{font-size:26px;color:var(--gold);text-shadow:2px 2px 0 #5a2a10}
.top .sub{color:var(--mute);font-size:13px}
.btn{background:linear-gradient(180deg,#3a57b8,#1c2a72);border:2px solid var(--rim);border-radius:6px;padding:8px 14px;font-family:var(--font-d);font-size:15px;letter-spacing:.04em}
.btn:hover:not(:disabled){filter:brightness(1.18)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:linear-gradient(180deg,#d98a3e,#8d4518);border-color:#ffe2b0}
.btn.ghost{background:transparent}
.wrap{max-width:1260px;margin:0 auto}
.hint{font-size:12.5px;color:var(--mute)} .hint b{color:var(--gold);font-weight:600}

/* element pill */
.el{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-d);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:0 7px;background:#0008;color:var(--c);border:1px solid var(--c);white-space:nowrap}
.el::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.affs{display:flex;flex-wrap:wrap;gap:3px}
.aff{font-size:10.5px;border-radius:4px;padding:0 5px;font-family:var(--font-d);border:1px solid var(--c);color:var(--c);background:#0006;white-space:nowrap}
.aff b{color:var(--ink);font-weight:500;margin-left:3px}

/* ---- full card (setup + detail) ---- */
.card{position:relative;background:var(--parch);color:var(--parch-ink);border:3px solid var(--wood);border-radius:8px;box-shadow:inset 0 0 0 2px #fff6dd,0 3px 0 #0006;display:flex;flex-direction:column;overflow:hidden}
.card .art{height:104px;background:radial-gradient(circle at 50% 60%,#fff 0%,#e8dcc0 70%);display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--wood);position:relative}
.card .art img{image-rendering:pixelated;max-width:90%;max-height:90%;object-fit:contain}
.card .art .el{position:absolute;left:6px;top:6px}
.card .nm{font-family:var(--font-d);font-weight:700;font-size:15px;padding:4px 8px 0;line-height:1.1}
.card .role{font-size:11px;color:#7a6440;padding:0 8px;letter-spacing:.06em;text-transform:uppercase}
.stats{display:flex;gap:4px;padding:4px 8px}
.st{font-family:var(--font-d);font-size:13px;background:#2b2318;color:var(--parch);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums}
.st b{color:var(--gold);font-weight:500;margin-right:3px;font-size:11px}
.card .affs{padding:2px 8px}
.card .aff{background:#2b2318}
.ab{font-size:11.5px;line-height:1.35;padding:4px 8px 8px} .ab b{font-weight:600}

/* ---- setup ---- */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.pickgrid .card{cursor:pointer;transition:transform .12s}
.pickgrid .card.sel{border-color:var(--gold);box-shadow:inset 0 0 0 2px #fff6dd,0 0 0 3px var(--gold),0 3px 0 #0006;transform:translateY(-3px)}
.pickgrid .card .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2b2318;font-family:var(--font-d);display:none;align-items:center;justify-content:center;z-index:2}
.pickgrid .card.sel .tick{display:flex}
.side{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg button{flex:1;min-width:110px;text-align:left;padding:8px 10px;border-radius:6px;border:2px solid #6f7cb0;background:#0f1846}
.seg button.on{border-color:var(--gold);background:#24306d}
.seg small{display:block;color:var(--mute);font-size:11.5px;font-family:var(--font-b)}
.rules{font-size:12.5px} .rules ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px} .rules b{color:var(--gold);font-weight:600}

/* ---- board ---- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.sidebar{display:flex;flex-direction:column;gap:10px;position:sticky;top:max(10px,env(safe-area-inset-top,0px))}
.mainc{display:flex;flex-direction:column;gap:10px;min-width:0}

.table{position:relative;border:3px solid #4a3520;border-radius:14px;background:radial-gradient(ellipse at 50% 50%,var(--felt) 0%,var(--felt2) 80%);box-shadow:inset 0 0 40px #000a,0 8px 20px #0009;padding:8px 10px 12px;overflow:hidden}
.table::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,#e8914a33,transparent 60%);pointer-events:none}
.side-row{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2.5vw,26px);padding-top:122px}
.side-head{position:absolute;left:4px;top:4px;display:flex;flex-direction:column;gap:4px;z-index:1}
.side-head h2{font-size:16px}
.itemrow{display:flex;gap:4px}
.itemrow .ii{width:24px;height:24px;border-radius:5px;background:#0b1238;border:1px solid #6f7cb0;display:flex;align-items:center;justify-content:center}
.itemrow .ii img{width:20px;height:20px;object-fit:contain;image-rendering:pixelated}
.itemrow .ii.used{opacity:.25;filter:grayscale(1)}
.alive{font-family:var(--font-d);font-size:12px;color:var(--mute)}

/* slot */
.slot{position:relative;width:clamp(92px,15vw,138px);display:flex;flex-direction:column;align-items:center;transition:transform .45s cubic-bezier(.3,1.4,.5,1);z-index:2}
.slot.mine.fwd{transform:translateY(-22px) scale(1.08)}
.slot.theirs.fwd{transform:translateY(16px) scale(1.08)}
.flat{width:100%;perspective:520px}
.flatcard{position:relative;transform:rotateX(14deg);transform-origin:50% 100%;background:var(--parch);color:var(--parch-ink);border:3px solid var(--wood);border-radius:8px;box-shadow:inset 0 0 0 2px #fff6dd,0 10px 10px #0009;overflow:hidden;transition:filter .3s, box-shadow .3s}
.flatcard .fa{height:clamp(54px,8vw,74px);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,#fff 0%,#e8dcc0 70%);border-bottom:2px solid var(--wood)}
.flatcard .fa img{max-height:90%;max-width:88%;image-rendering:pixelated;object-fit:contain}
.flatcard .fn{font-family:var(--font-d);font-size:clamp(11px,1.5vw,13.5px);padding:2px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flatcard .fs{display:flex;gap:3px;padding:1px 5px 5px;font-family:var(--font-d);font-size:11px;flex-wrap:wrap}
.flatcard .cost{position:absolute;top:3px;right:4px;font-size:11px;color:#c08a1a;text-shadow:0 1px 0 #fff;letter-spacing:-1px}
.flatcard .elb{position:absolute;top:3px;left:3px}
.flatcard .fs span{background:#2b2318;color:var(--parch);border-radius:3px;padding:0 4px}
.slot.fwd .flatcard{box-shadow:inset 0 0 0 2px #fff6dd,0 0 0 3px var(--holo),0 0 22px #7fe9ff88,0 10px 10px #0009}
.slot.ko .flatcard{filter:grayscale(1) brightness(.45)}
.slot.ko .flat::after{content:"KO";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:30px;color:var(--hurt);text-shadow:2px 2px 0 #000;z-index:3}
.slot .flat{position:relative}
.hpl{width:100%;margin-top:6px;display:flex;flex-direction:column;gap:2px;align-items:stretch}
.hpl .t{font-family:var(--font-d);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.hpbar{height:8px;border-radius:4px;background:#3a2c1c;overflow:hidden;border:1px solid #000}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#4fbf6c,#9be58a);transition:width .5s}
.hpbar.low i{background:linear-gradient(90deg,#d94b3b,#f08a5a)}
.slot.pickable{cursor:pointer}
.slot.pickable .flatcard{box-shadow:inset 0 0 0 2px #fff6dd,0 0 0 3px var(--gold),0 10px 10px #0009;animation:pulse 1.2s infinite}
.slot.picked .flatcard{box-shadow:inset 0 0 0 2px #fff6dd,0 0 0 4px var(--heal),0 0 18px var(--heal)}
@keyframes pulse{50%{filter:brightness(1.15)}}

/* hologram */
.holo{position:absolute;left:50%;bottom:calc(100% - 52px);width:150%;height:122px;transform:translateX(-50%);pointer-events:none;display:flex;align-items:flex-end;justify-content:center;z-index:4}
.holo .beam{position:absolute;left:18%;right:18%;bottom:6px;height:0;background:linear-gradient(0deg,#7fe9ffaa,#7fe9ff00);clip-path:polygon(18% 100%,82% 100%,100% 0,0 0);opacity:0}
.holo .base{position:absolute;bottom:0;left:50%;width:70%;height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#7fe9ff99,#7fe9ff00 70%);opacity:0}
.holo .spr{position:relative;max-height:112px;max-width:100%;image-rendering:pixelated;object-fit:contain;opacity:0;transform:translateY(24px) scaleY(.1);transform-origin:50% 100%;filter:drop-shadow(0 0 6px #7fe9ffaa)}
.holo .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#7fe9ff14 0 2px,transparent 2px 4px);mix-blend-mode:screen;opacity:0;pointer-events:none}
.holo.on .spr{opacity:1;transform:none;transition:transform .5s cubic-bezier(.2,1.5,.4,1) .15s,opacity .2s .15s;animation:bob 2.4s ease-in-out .7s infinite,flick 4s steps(1) 1s infinite}
.holo.on .base{opacity:1;transition:opacity .3s}
.holo.on .scan{opacity:1}
.holo.on .beam{animation:beam .8s ease-out}
.holo.off .spr{transition:transform .3s,opacity .3s;opacity:0;transform:translateY(20px) scaleY(.1)}
@keyframes beam{0%{height:0;opacity:.9}40%{height:120px;opacity:.9}100%{height:120px;opacity:0}}
@keyframes bob{50%{translate:0 -4px}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:.55}93%{opacity:1}}
.slot.theirs .holo .spr{scale:-1 1}

/* buffs */
.slot.b-str .holo .spr{filter:drop-shadow(0 0 6px #ff5a2a) drop-shadow(0 0 12px #ffae3a) brightness(1.15)}
.slot.b-shard .holo .spr{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #c9a8ff) saturate(.4) brightness(1.2)}
.slot.b-smoke .holo .spr{filter:drop-shadow(0 0 8px #9aa0a8) contrast(.9) brightness(.9)}
.barrier{position:absolute;left:50%;bottom:4px;width:96px;height:112px;transform:translateX(-50%);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffe2b055,#c9925a33 40%,#7fe9ff44);box-shadow:inset 0 0 18px #fff;animation:barrierIn .4s ease-out;z-index:5}
.barrier::after{content:"";position:absolute;inset:4px;clip-path:inherit;border:0;background:repeating-linear-gradient(60deg,#fff3 0 2px,transparent 2px 14px)}
.barrier.crack{animation:barrierHit .4s}
.barrier.shatter{animation:shatter .45s forwards}
@keyframes barrierIn{0%{transform:translateX(-50%) scale(.2);opacity:0}70%{transform:translateX(-50%) scale(1.1);opacity:1}100%{transform:translateX(-50%) scale(1)}}
@keyframes barrierHit{50%{filter:brightness(2.4)}}
@keyframes shatter{0%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.5);filter:blur(3px) brightness(2)}}

/* cost + chart */
.stars{color:#c08a1a;letter-spacing:-1px;font-size:13px}
.card .cost{position:absolute;right:6px;top:6px;font-family:var(--font-d);font-size:14px;color:#c08a1a;text-shadow:0 1px 0 #fff;z-index:1}
.pickgrid .card.dis{opacity:.45;cursor:not-allowed}
.teambar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.budget{display:flex;gap:3px}
.budget i{width:18px;height:18px;border-radius:4px;border:2px solid var(--rim);background:#0b1238}
.budget i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.budget i.over{background:var(--hurt)}
.chart svg{width:100%;height:auto;display:block}
.chart .pairs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px}
.chart .pairs span{display:inline-flex;align-items:center;gap:4px}
.card .stats{flex-wrap:wrap}
/* v0.5: element-coloured borders */
.card[style*="--ec"]{border-color:var(--ec);box-shadow:inset 0 0 0 2px #fff6dd,0 0 0 1px #0006,0 3px 0 #0006,0 0 10px color-mix(in srgb,var(--ec) 35%,transparent)}
.slot .flatcard{border-color:var(--ec,var(--wood))}
.flatcard .fs .spd{background:#3b2a5c;color:#e9dcff}
/* v0.5: hover lifts a card a little; a selected/played card lifts further; the active card never lifts on hover */
.pickgrid .card{transition:transform .16s ease, box-shadow .16s}
.pickgrid .card:not(.dis):not(.sel):hover{transform:translateY(-5px)}
.pickgrid .card.sel{transform:translateY(-11px)}
.slot .flat{transition:transform .16s ease}
.slot:not(.fwd):not(.ko):hover .flat{transform:translateY(-7px)}
.slot.picked .flat{transform:translateY(-16px)}
.act{transition:transform .15s ease, box-shadow .15s}
.act:not(:disabled):not(.on):hover{transform:translateY(-5px)}
.act.on{transform:translateY(-12px)}
.slot.downed .flatcard{filter:grayscale(1) brightness(.5)}
/* v0.5: face-down action slots */
.flip.empty .face.back{background:transparent;border:2px dashed #6f7cb0}
.flip .cb{width:26px;height:26px;border-radius:50%;border:2px solid var(--rim);background:radial-gradient(circle,#f4c95d 0 30%,transparent 32%)}
.flip.drop0{animation:drop0 .45s cubic-bezier(.2,1.3,.4,1)}
.flip.drop1{animation:drop1 .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop0{0%{transform:translateY(90px) rotate(-10deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes drop1{0%{transform:translateY(-90px) rotate(10deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.ftag{font-size:11px;color:var(--mute);min-height:15px}
.lane .mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.timer{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px}
.timer span{font-family:var(--font-d);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.timer span.low{color:var(--hurt)}
.tbar{width:70px;height:4px;border-radius:2px;background:#0b1238;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.seatbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.seatbar button{border:1px solid #6f7cb0;background:#0f1846;border-radius:6px;padding:4px 10px;font-family:var(--font-d);font-size:13px}
.seatbar button.on{background:var(--gold);color:#2b2318;border-color:var(--gold)}
.placedrow{display:flex;align-items:center;gap:12px}
.cbmini{width:44px;height:60px;border-radius:6px;border:2px solid var(--rim);background:repeating-linear-gradient(45deg,#2a3c8c 0 8px,#1b2768 8px 16px);flex:none;animation:drop0 .45s cubic-bezier(.2,1.3,.4,1)}
.ctrlbox{display:flex;flex-direction:column;gap:6px}
/* particles + pops */
.fxl{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:visible}
.pt{position:absolute;width:var(--sz,6px);height:var(--sz,6px);border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pc);animation:pt var(--d,.9s) ease-out forwards}
@keyframes pt{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.puff{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#c9ced6dd,#8a909a66 60%,transparent 70%);animation:puff 1s ease-out forwards}
@keyframes puff{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.6);opacity:0}}
.ipop{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);animation:ipop .75s ease-out forwards;filter:drop-shadow(0 0 8px #fff)}
.ipop img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
@keyframes ipop{0%{transform:translate(-50%,0) scale(.3);opacity:0}30%{transform:translate(-50%,-60%) scale(1.25);opacity:1}70%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-10%) scale(.4);opacity:0}}
.flash{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0%,var(--pc) 40%,transparent 70%);animation:flash .45s ease-out forwards}
@keyframes flash{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(7);opacity:0}}
.ring{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid var(--pc);animation:ring .5s ease-out forwards}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(4);opacity:0;border-width:1px}}
.ray{position:absolute;width:4px;height:44px;transform-origin:50% 100%;background:linear-gradient(0deg,transparent,#fff,var(--pc));animation:ray .38s ease-out forwards}
@keyframes ray{0%{opacity:1;scale:1 .2}60%{opacity:1;scale:1 1.2}100%{opacity:0;scale:1 1.4}}
.pop{position:absolute;transform:translate(-50%,0);font-family:var(--font-d);font-size:30px;font-weight:700;text-shadow:2px 2px 0 #000,0 0 6px #000;pointer-events:none;animation:pop 1.3s ease-out forwards;text-align:center;line-height:1;white-space:nowrap}
.pop small{display:block;font-size:12px;margin-top:3px}
.pop.dmg{color:var(--hurt)} .pop.heal{color:var(--heal)} .pop.zero{color:#fff}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.2)}80%{opacity:1;transform:translate(-50%,-26px) scale(1)}100%{opacity:0;transform:translate(-50%,-40px)}}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-6px 2px}40%{translate:6px -2px}60%{translate:-4px 1px}80%{translate:3px 0}}

/* lane */
.lane{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:34px auto 4px;max-width:440px;z-index:1}
.rslot{display:flex;flex-direction:column;align-items:center;gap:3px}
.flip{width:104px;height:62px;perspective:600px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--rim);font-family:var(--font-d);text-align:center;line-height:1.1;padding:2px}
.flip .back{background:repeating-linear-gradient(45deg,#2a3c8c 0 8px,#1b2768 8px 16px);font-size:13px;color:var(--mute)}
.flip .front{transform:rotateY(180deg);background:var(--parch);color:var(--parch-ink);font-size:13.5px}
.flip .front small{font-family:var(--font-b);font-size:10.5px;color:#7a6440}
.vs{font-family:var(--font-d);font-size:20px;color:var(--ember);text-shadow:2px 2px 0 #3a1a08;text-align:center}
.status{font-size:13px;color:var(--ink);text-align:center;min-height:20px}

/* picker */
.picker h3{font-size:16px;margin-bottom:8px}
.actgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.act{position:relative;background:var(--parch);color:var(--parch-ink);border:3px solid var(--wood);border-radius:8px;padding:6px 5px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.act img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.act .ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:22px;color:#5a4a30}
.act .t{font-family:var(--font-d);font-size:13.5px;font-weight:700;line-height:1.1}
.act .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7a6440}
.act .d{font-size:10.5px;line-height:1.25;color:#5a4a30}
.act.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold);transform:translateY(-3px)}
.act:disabled{opacity:.35;cursor:not-allowed}
.act.used::after{content:"USED";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:18px;color:var(--hurt);transform:rotate(-14deg)}
.lockrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}

/* sidebar */
.detail .card{border-width:2px}
.log{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.log .r{border-top:1px solid #4a5aa0;padding-top:6px} .log .r:first-child{border-top:0;padding-top:0}
.log .rh{font-family:var(--font-d);color:var(--gold);font-size:13px}
.log .ln.m{color:var(--mute)} .log .ln.k{color:var(--hurt)} .log .ln.g{color:var(--heal)}
.log b{color:var(--gold);font-weight:600}
.prize{display:flex;gap:10px;align-items:center}
.prize img{image-rendering:pixelated;height:52px;width:52px;object-fit:contain;background:var(--parch);border-radius:6px;border:2px solid var(--wood)}

/* end */
.end{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.end h2{font-size:30px;color:var(--gold)}
.survey{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.q .opts{display:flex;gap:4px}
.q .opts button{border:1px solid #6f7cb0;background:#0f1846;border-radius:4px;padding:3px 8px;font-size:12px}
.q .opts button.on{background:var(--gold);color:#2b2318;border-color:var(--gold)}
textarea{width:100%;min-height:70px;background:#0b1238;color:var(--ink);border:1px solid #6f7cb0;border-radius:6px;padding:8px;font:inherit;font-size:12.5px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.statgrid div{background:#0b1238;border:1px solid #4a5aa0;border-radius:6px;padding:6px}
.statgrid b{display:block;font-family:var(--font-d);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.statgrid span{font-size:11px;color:var(--mute)}

@media (max-width:1000px){.board,.setup{grid-template-columns:minmax(0,1fr)}.sidebar{position:static}}
@media (max-width:820px){.actgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:620px){
  .actgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side-row{padding-top:132px}
  .holo{height:100px}.holo .spr{max-height:92px}
  .flip{width:88px;height:56px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* ===== v0.6 board-game skin: the game's own system-UI family (Save/Healing/Shop): parchment, thin gold + wood rings, Signika ===== */
:root{
  --ground:#24170c; --ink:#3a1e06; --mute:#7f6140; --gold:#9a6512; --rim:#c9a44a; --wood:#7a4e20; --wood2:#b8865a;
  --hurt:#d9412f; --heal:#3fae5c; --parch:#fbf4dc; --parch-ink:#3a1e06;
  --font-b:"Signika","Lexend",system-ui,sans-serif; --font-d:"Signika","Lexend",system-ui,sans-serif; --font-n:"Pixelify Sans","Courier New",monospace;
}
body{background:radial-gradient(ellipse at 50% -10%,#5a3a1e 0%,#2d1c0e 55%,#1d1208 100%) fixed,#1d1208;color:var(--ink)}
h1,h2,h3{font-weight:600;letter-spacing:0}
.top h1{color:#f4d58a;text-shadow:0 2px 0 #3a1e06;font-size:28px}
.top .sub{color:#d9c49a}
.top .btn.ghost{color:#f4e3b8;border:1px solid var(--wood2);background:#3a1e0699}
.top .btn.surr.armed{background:linear-gradient(180deg,#a8402e,#7a2416);border-color:#f1c27a;color:#fff3d0;animation:surrpulse .9s ease-in-out infinite}
.top .btn.surr:disabled{opacity:.45;cursor:not-allowed}
/* ===== finish + series overlays ===== */
.ovl{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;cursor:pointer;animation:ovlIn .25s ease-out both}
.ovl.out{animation:ovlOut .45s ease-in forwards}
@keyframes ovlIn{from{opacity:0}to{opacity:1}} @keyframes ovlOut{to{opacity:0}}
.ovl .bigt{font-family:var(--font-d);font-weight:900;letter-spacing:.08em;line-height:1;font-size:clamp(52px,12vw,132px);position:relative;z-index:2;text-align:center}
.ovl .subt{font-family:var(--font-b);font-weight:700;font-size:clamp(15px,2.2vw,22px);letter-spacing:.14em;text-transform:uppercase;position:relative;z-index:2;opacity:0;animation:subIn .4s .55s ease-out forwards}
@keyframes subIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ovl .pips{display:flex;align-items:center;gap:18px;position:relative;z-index:2;opacity:0;animation:subIn .4s .75s ease-out forwards}
.ovl .pips .pside{display:flex;align-items:center;gap:7px;font-family:var(--font-b);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.ovl .pip{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;opacity:.55}
.ovl .pip.on{background:currentColor;opacity:1;box-shadow:0 0 10px currentColor}
.ovl .pip.new{animation:pipPop .55s 1.05s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pipPop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.ovl .dash{font-family:var(--font-d);font-size:22px;opacity:.7}
/* Victory: gold, punch-in, rays + sparkles */
.ovl.v-win{background:radial-gradient(ellipse at center,#3a250ccc 0%,#120a03ee 70%);color:#f4d27a}
.ovl.v-win .bigt{background:linear-gradient(180deg,#fffbe6 0%,#ffe08a 38%,#e0a83a 62%,#9a6a16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a3a0a) drop-shadow(0 0 22px #f4c95d99);animation:vicIn .7s cubic-bezier(.2,1.4,.35,1) both}
@keyframes vicIn{0%{transform:scale(2.6);opacity:0;filter:blur(8px)}55%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.ovl .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;z-index:1;opacity:.0;background:repeating-conic-gradient(from 0deg,#f4c95d22 0 6deg,transparent 6deg 18deg);animation:raysIn .8s .15s ease-out forwards,raysSpin 14s linear infinite;mask:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes raysIn{to{opacity:1}} @keyframes raysSpin{to{transform:rotate(360deg)}}
.ovl .spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:2px;z-index:1;background:#ffe08a;box-shadow:0 0 8px #ffd25e;animation:sparkFly 1.3s var(--d,0s) cubic-bezier(.15,.7,.3,1) forwards;opacity:0}
@keyframes sparkFly{0%{transform:translate(-50%,-50%) rotate(0) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1);opacity:0}}
/* Defeat: heavy drop, desaturated board, slump */
.ovl.v-lose{background:radial-gradient(ellipse at center,#1a0c0acc 0%,#050202f2 75%);color:#b9a89a;backdrop-filter:grayscale(1) brightness(.7);-webkit-backdrop-filter:grayscale(1) brightness(.7)}
.ovl.v-lose .bigt{background:linear-gradient(180deg,#e9e2d8 0%,#a89a8c 50%,#5e5249 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #1d1310) drop-shadow(0 0 18px #6a1d1466);animation:defIn .75s cubic-bezier(.5,0,.75,0) both,defSlump 2.2s .9s ease-in-out forwards}
@keyframes defIn{0%{transform:translateY(-70vh);opacity:0}70%{transform:translateY(0);opacity:1}82%{transform:translateY(-10px)}100%{transform:translateY(0)}}
@keyframes defSlump{to{transform:translateY(6px) rotate(-2deg);letter-spacing:.14em}}
.ovl.v-lose .crack{position:absolute;left:0;right:0;top:50%;height:2px;z-index:1;background:linear-gradient(90deg,transparent,#8a2a1c 20%,#c0392b 50%,#8a2a1c 80%,transparent);transform:scaleX(0);animation:crack .35s .62s ease-out forwards;box-shadow:0 0 12px #c0392b}
@keyframes crack{to{transform:scaleX(1)}}
.ovl.shake{animation:ovlIn .25s ease-out both,shake .35s .62s linear}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
/* Draw: silver */
.ovl.v-draw{background:radial-gradient(ellipse at center,#1d2230cc 0%,#07080cf0 75%);color:#cfd6e4}
.ovl.v-draw .bigt{background:linear-gradient(180deg,#ffffff,#c6cedc 50%,#7b8496);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #2a2f3a);animation:drawIn .6s ease-out both}
@keyframes drawIn{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
/* Game-start banner (series) */
.ovl.v-game{background:linear-gradient(180deg,transparent 30%,#120a03d9 42%,#120a03d9 58%,transparent 70%);color:#f4d27a;cursor:default;pointer-events:none}
.ovl.v-game .bigt{font-size:clamp(44px,9vw,96px);color:#f8ecc8;text-shadow:0 3px 0 #5a3a0a,0 0 18px #f4c95d88;animation:gameIn 1.9s cubic-bezier(.2,.9,.3,1) both}
@keyframes gameIn{0%{transform:translateX(-60vw);opacity:0}22%{transform:translateX(0);opacity:1}78%{transform:translateX(0);opacity:1}100%{transform:translateX(60vw);opacity:0}}
.ovl.v-game .tag{font-family:var(--font-b);font-weight:800;letter-spacing:.24em;font-size:15px;color:#ffb35c;text-shadow:0 0 10px #ff7a2a;animation:tagBlink .5s .3s ease-in-out 3 alternate both}
@keyframes tagBlink{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion: reduce){ .ovl *, .ovl{animation-duration:.01s !important;animation-delay:0s !important} .ovl .rays,.ovl .spark{display:none} }
.end .series{font-family:var(--font-b);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:#7a5a3a;margin:2px 0 6px}
@keyframes surrpulse{50%{box-shadow:0 0 0 3px #f1c27a66}}
.win{background:repeating-linear-gradient(0deg,transparent 0 25px,#7a4e200d 25px 26px),linear-gradient(180deg,#f8f0d4,#ede0b0);border:2px solid var(--rim);
  box-shadow:0 0 0 2px var(--wood),0 0 0 4px var(--wood2),0 10px 22px #000a;border-radius:10px;color:var(--ink)}
.label{font-family:var(--font-b);color:#8a6a3a;letter-spacing:.08em;font-size:11.5px;font-weight:600}
.hint{color:var(--mute)} .hint b,.rules b{color:#7a3e08;font-weight:600}
.btn{font-family:var(--font-b);background:linear-gradient(180deg,#7a5230,#5c3818);border:1px solid #3a1e06;color:#f8f0d4;box-shadow:inset 0 1px 0 #ffffff26,0 2px 0 #0005;font-size:15px;letter-spacing:.01em}
.btn.go{border:2px solid var(--rim);box-shadow:inset 0 1px 0 #ffffff26,0 0 10px #c9a44a77}
.win .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--wood)}
.seg button,.seatbar button,.q .opts button{background:#f3e6c2;border:1px solid var(--wood2);color:var(--ink);font-family:var(--font-b)}
.seg button.on,.seatbar button.on,.q .opts button.on{background:linear-gradient(180deg,#7a5230,#5c3818);color:#f8f0d4;border-color:var(--rim)}
.seg small{color:#8a6a3a} .seg button.on small{color:#e8d6a8}
.itemrow .ii{background:#f3e6c2;border:1px solid var(--wood2)}
.budget i{background:#f3e6c2;border-color:var(--wood)} .budget i.on{background:#d9a640;box-shadow:0 0 6px #d9a640}
.statgrid div{background:#f3e6c2;border:1px solid var(--rim)} .statgrid b{color:#7a3e08;font-family:var(--font-n)} .statgrid span{color:var(--mute)}
textarea{background:#fffaf0;color:var(--ink);border:1px solid var(--wood2)}
.log .r{border-top:1px solid #c9a44a66} .log .rh{color:#7a3e08;font-family:var(--font-b);font-weight:600} .log .ln.m{color:var(--mute)} .log .ln.k{color:#a8301e} .log .ln.g{color:#2e7a3e} .log b{color:#7a3e08}
.status{color:var(--ink);font-weight:600;text-shadow:0 1px 0 #fff8}
.vs{color:#8a3a10;text-shadow:0 1px 0 #fff8;font-family:var(--font-b);font-weight:600}

.alive{color:var(--mute)}
.end h2{color:#7a3e08}
.pop{font-family:var(--font-n)}
/* board */
.table{background:url("board.webp") center/100% 100% no-repeat;border:0;border-radius:6px;box-shadow:0 14px 34px #000c;padding:3.2% 5.5% 3.6%;user-select:none;-webkit-user-select:none}

.lane{margin-top:22px}

.ftag{color:var(--mute);font-weight:600}
.timer span{color:var(--ink)} .tbar{background:#e0cc9a} .tbar i{background:#9a6512}
.cbmini{background:radial-gradient(circle at 50% 50%,#c9a44a 0 9%,transparent 10%),repeating-linear-gradient(45deg,#8a3420 0 6px,#6a2414 6px 12px);border:2px solid var(--rim)}
.hpl .t{color:var(--ink);font-family:var(--font-n);text-shadow:0 1px 0 #fff8}
/* ===== v0.6.1 element frames: thick coloured frame + glow + tinted art window ===== */

.card[style*="--ec"] .art{background:radial-gradient(circle at 50% 60%,#fff 0%,#efe3c6 72%);border-bottom:2px solid var(--ec)}

.el{background:#fffaf0;color:#3a1e06;border:1.5px solid var(--c);gap:4px;padding:1px 7px 1px 5px;font-family:var(--font-b);font-weight:600;letter-spacing:.02em}

.hpico{width:17px;height:17px} .hpl .t svg{width:13px;height:13px;margin-right:3px;vertical-align:-2px}
.elcoin{top:-15px;left:-15px;width:38px;height:38px;border-width:3px} .elcoin svg{width:18px;height:18px} .elcoin .eico{width:24px;height:24px}
.flatcard .elcoin{top:-12px;left:-12px;width:30px;height:30px;border-width:2.5px} .flatcard .elcoin svg{width:14px;height:14px} .flatcard .elcoin .eico{width:19px;height:19px}
/* badge placements */
.card{overflow:visible} .card .art{border-radius:5px 5px 0 0;overflow:hidden}
.flatcard{overflow:visible} .flatcard .fa{position:relative;border-radius:5px 5px 0 0;overflow:hidden}
.elcoin{position:absolute;top:-11px;left:-11px;width:27px;height:27px;border-radius:50%;background:#fffaf0;border:2.5px solid var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 3px #0006;z-index:4}
.elcoin svg{width:13px;height:13px} .elcoin .eico{width:17px;height:17px;border-radius:3px}
.flatcard .elcoin{top:-9px;left:-9px;width:23px;height:23px;border-width:2px} .flatcard .elcoin svg{width:11px;height:11px} .flatcard .elcoin .eico{width:14px;height:14px}
.elname{display:inline-flex;align-items:center;margin-right:4px;vertical-align:-1px}
.elname svg{width:12px;height:12px} .elname .eico{width:14px;height:14px;border-radius:2px}
.st.elst{display:inline-flex;align-items:center;gap:3px;background:#fffaf0;color:#3a1e06;border:1.5px solid var(--c);font-family:var(--font-b);font-weight:600;font-size:11.5px}
.st.elst svg{width:11px;height:11px} .st.elst .eico{width:13px;height:13px}
.flatcard .fa .el{position:absolute;left:3px;top:3px;font-size:9.5px;padding:0 5px 0 3px}
.flatcard .fa .el svg{width:10px;height:10px} .flatcard .fa .el .eico{width:12px;height:12px}
.card .role .elword{font-weight:600}
/* option A = the game's own element colours (linked-text/lt-terms.js DAMAGE) */
body.elA{--e-phys:#555555;--e-air:#48c774;--e-bolt:#9b59b6;--e-dark:#4b0082;--e-earth:#8b5e3c;--e-fire:#e25822;--e-ice:#5ab3d4;--e-light:#a38b50;--e-poison:#2e8b57}
/* ===== hands (fanned, GITCG / Hearthstone style) ===== */
.pickgrid .card.sel{box-shadow:0 0 0 1px #3a1e06,0 0 0 4px #f4c95d,0 0 18px #f4c95d}
/* ===== reveal slots are card-shaped and show the art ===== */
.flip{width:92px;height:124px}
.flip .front{justify-content:flex-start;gap:3px;padding:7px 5px;font-size:12px;line-height:1.1;font-weight:600}
.flip .front img{width:62px;height:62px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 2px 2px #0004)}
.flip .front .fi{width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--wood)}
/* reveal flip: lift, turn edge-on, land face-up */
@keyframes cardflip{0%{transform:translateY(0) rotateY(0) scale(1)}45%{transform:translateY(-14px) rotateY(95deg) scale(1.14)}100%{transform:translateY(0) rotateY(180deg) scale(1)}}
.flip.flipping .in{animation:cardflip .62s cubic-bezier(.3,.75,.3,1) forwards}
.flip.flipping .face{box-shadow:0 10px 18px #0006}
@keyframes flipglint{0%{opacity:0}55%{opacity:.85}100%{opacity:0}}
.flip.flipping .front::after{content:"";position:absolute;inset:0;border-radius:7px;background:linear-gradient(115deg,transparent 30%,#fff8 48%,transparent 66%);animation:flipglint .62s ease-out forwards;pointer-events:none}
@media (max-width:620px){ .flip{width:74px;height:100px} .flip .front img,.flip .front .fi{width:46px;height:46px} }
/* item hologram rising from the played card (Yu-Gi-Oh style) */
.iholo{position:absolute;width:74px;height:74px;transform:translate(-50%,-50%);pointer-events:none;z-index:25}
.iholo img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 8px #7fe9ff) drop-shadow(0 0 16px #ffffff88)}
.iholo::before{content:"";position:absolute;left:50%;bottom:-46px;width:58px;height:70px;transform:translateX(-50%);background:linear-gradient(0deg,#7fe9ffaa,#7fe9ff00);clip-path:polygon(30% 100%,70% 100%,100% 0,0 0);opacity:var(--beam,1);transition:opacity .2s}
.iholo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#7fe9ff22 0 2px,transparent 2px 4px);mix-blend-mode:screen}
/* ===== hands (fanned, GITCG / Hearthstone style) ===== */
.hand{position:relative;display:flex;justify-content:center;align-items:flex-end;z-index:6;pointer-events:none}
.hand.mine{height:132px;margin-top:2px}
.hand.theirs{height:44px;margin-bottom:-6px;align-items:flex-start}
.hcard{pointer-events:auto;position:relative;width:84px;height:116px;margin:0 -5px;border-radius:9px;background:linear-gradient(180deg,#fffaf0,#f1e2b8);border:2px solid var(--rim);
  box-shadow:0 0 0 1px var(--wood),0 8px 14px #0007;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 5px 5px;text-align:center;
  transform:translateY(var(--y,0px)) rotate(var(--r,0deg));transform-origin:50% 120%;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s;cursor:grab;touch-action:none;user-select:none}
.hcard img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.hcard .ico{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--wood)}
.hcard .t{font-size:11.5px;font-weight:600;line-height:1.05;color:var(--ink)}
.hcard .k{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8a6a3a}
.hcard .d{font-size:9.5px;line-height:1.15;color:#5a4028}
.hcard.pass{background:linear-gradient(180deg,#efe4c4,#dcc898)}
.hcard:not(.off):hover,.hcard:not(.off):focus-visible{transform:translateY(-16px) rotate(0deg) scale(1.06);z-index:3;box-shadow:0 0 0 1px var(--wood),0 14px 20px #0008}
.hcard.sel{transform:translateY(-30px) rotate(0deg) scale(1.08);z-index:4;box-shadow:0 0 0 2px #f4c95d,0 0 16px #f4c95d,0 16px 22px #0008}
.hcard.off{cursor:default;filter:saturate(.6) brightness(.92)}
.hcard.dragging{opacity:.25}
.hback{width:34px;height:46px;margin:0 -7px;border-radius:5px;transform:rotate(var(--r,0deg));transform-origin:50% -60%;
  background:radial-gradient(circle at 50% 50%,#c9a44a 0 9%,transparent 10%),repeating-linear-gradient(45deg,#8a3420 0 5px,#6a2414 5px 10px);border:2px solid var(--rim);box-shadow:0 0 0 1px #3a1e06,0 4px 6px #0006}
/* drag, drop zones, flights */
.dragghost{position:fixed;z-index:9999;pointer-events:none;margin:0;transition:none;transform-origin:50% 50%;box-shadow:0 22px 30px #000a !important}
.dropok{outline:3px dashed #c9a44a;outline-offset:5px;border-radius:10px}
.dropover{outline:3px solid #f4c95d;outline-offset:5px;box-shadow:0 0 22px #f4c95d}
.side-row.dropok,.side-row.dropover{outline-offset:-2px}
/* ===== round timer: a full-width fuse across the middle of the board (above the board art, below every card / UI) ===== */
.fuse{position:absolute;left:1.5%;right:1.5%;height:12px;margin-top:-6px;z-index:0;pointer-events:none;opacity:0;transition:opacity .3s}
.fuse.on{opacity:1}
.fuse .trk{position:absolute;inset:0;border-radius:6px;background:#0e1a2acc;box-shadow:inset 0 1px 3px #000c,0 0 0 1px #ffffff22}
.fuse .fill{position:absolute;inset:2px;border-radius:4px;transform-origin:50% 50%;transform:scaleX(1);transition:transform .25s linear,background .4s,box-shadow .4s;
  background:linear-gradient(90deg,#1fb6ff,#7ff3ff 50%,#1fb6ff);box-shadow:0 0 10px #3fd4ff,0 0 22px #3fd4ff88}
.fuse .fill::before,.fuse .fill::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,#bff6ff 45%,transparent 70%);filter:blur(.3px)}
.fuse .fill::before{left:-7px} .fuse .fill::after{right:-7px}
.fuse.warn .fill{background:linear-gradient(90deg,#ff8a1f,#ffd36b 50%,#ff8a1f);box-shadow:0 0 12px #ff9a2f,0 0 26px #ff8a1f99}
.fuse.crit{height:18px;margin-top:-9px}
.fuse.crit .fill{background:linear-gradient(90deg,#ff2d2d,#ff9a7a 50%,#ff2d2d);animation:fusePulse .5s ease-in-out infinite}
.fuse.crit .trk{box-shadow:inset 0 1px 3px #000c,0 0 0 2px #ff3b3b88,0 0 18px #ff2d2d66}
.fuse.shake{animation:fuseShake .18s linear infinite}
@keyframes fusePulse{0%,100%{box-shadow:0 0 12px #ff3b3b,0 0 26px #ff2d2daa;filter:brightness(1)}50%{box-shadow:0 0 22px #ff5b5b,0 0 46px #ff2d2dee;filter:brightness(1.35)}}
@keyframes fuseShake{0%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}50%{transform:translate(1.5px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}
.table.urgent{box-shadow:0 14px 34px #000c,0 0 0 3px #ff3b3b55,0 0 30px #ff2d2d55}
/* ===== announcement banner (FA_BANNER): a horizontal strip, text slides in ===== */
.annc{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 0;
  background:linear-gradient(90deg,transparent 0%,#1a0f05e6 14%,#1a0f05f2 50%,#1a0f05e6 86%,transparent 100%);border-top:2px solid #c9a44a;border-bottom:2px solid #c9a44a;
  animation:anncIn .32s cubic-bezier(.2,.9,.3,1) both}
.annc.out{animation:anncOut .35s ease-in forwards}
.annc .at{font-family:var(--font-d);font-weight:800;font-size:clamp(22px,4vw,38px);letter-spacing:.04em;color:#fbe6b0;text-shadow:0 2px 0 #4a2a08,0 0 14px #f4c95d66;white-space:nowrap;animation:anncTxt .5s .08s cubic-bezier(.15,.9,.25,1.05) both}
.annc .as{font-family:var(--font-b);font-weight:700;font-size:clamp(12px,1.6vw,15px);letter-spacing:.16em;text-transform:uppercase;color:#e8cf98;margin-top:4px;animation:anncTxt .5s .2s cubic-bezier(.15,.9,.25,1.05) both}
.annc::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#fff3 50%,transparent 65%);background-size:250% 100%;animation:anncShine .9s .15s ease-out both}
.annc.t-bad{border-color:#d9412f} .annc.t-bad .at{color:#ffd2c4;text-shadow:0 2px 0 #4a0f08,0 0 14px #ff5b4b88}
.annc.t-good{border-color:#7fd08a} .annc.t-good .at{color:#e6ffd8;text-shadow:0 2px 0 #12360f,0 0 14px #7fe29a88}
.annc.t-warn{border-color:#ff8a1f} .annc.t-warn .at{color:#ffe2b8;text-shadow:0 2px 0 #4a2008,0 0 14px #ff9a2f88}
@keyframes anncIn{0%{clip-path:inset(48% 0 48% 0);opacity:.2}100%{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes anncOut{0%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(50% 0 50% 0);opacity:0}}
@keyframes anncTxt{0%{transform:translateX(-46vw) skewX(-18deg);opacity:0}70%{transform:translateX(1.5vw) skewX(4deg);opacity:1}100%{transform:translateX(0) skewX(0);opacity:1}}
@keyframes anncShine{0%{background-position:120% 0}100%{background-position:-60% 0}}
@media (prefers-reduced-motion: reduce){ .annc,.annc *,.annc::before{animation-duration:.01s !important;animation-delay:0s !important} .fuse.shake{animation:none} }
/* ===== result screen buttons (Rematch / Next game / Leave on the VICTORY / DEFEAT screen itself) ===== */
.ovl.keep{cursor:default}
.ovl .obtns{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px;opacity:0;animation:subIn .4s 1.1s ease-out forwards}
.ovl .obtns .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ovl .obtns .btn{min-width:150px;font-size:16px;padding:9px 18px}
.ovl .obtns .onote{font-family:var(--font-b);font-weight:700;font-size:14px;letter-spacing:.06em;color:#f4e3b8;min-height:18px;text-shadow:0 1px 2px #000}
.ovl .obtns .onote.hot{color:#ffd36b;animation:tagBlink .6s ease-in-out infinite alternate}
.ovl .obtns .btn.glow{box-shadow:0 0 0 2px #ffd36b,0 0 18px #ffd36b;animation:surrpulse .9s ease-in-out infinite}
.ovl .obtns .vb{background:none;border:0;color:#e8d9b8;opacity:.75;font-family:var(--font-b);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:2px 6px}
.ovl .obtns .vb:hover{opacity:1}
/* ===== lobby: both players' ready status ===== */
.rdy{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rdy .who{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:8px;background:#7a4e2014;border:1px solid #c9a44a66}
.rdy .who b{font-size:15px}
.rdy .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-b);font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.rdy .chip.wait{background:#efe2c4;color:#7a5a3a;border:1px solid #c9a44a}
.rdy .chip.wait i{width:8px;height:8px;border-radius:50%;background:#c08a1a;animation:rdyDot 1s ease-in-out infinite}
.rdy .chip.ok{background:linear-gradient(180deg,#5cc46e,#2f8f45);color:#fff;border:1px solid #1f6a30;box-shadow:0 0 10px #5cc46e88}
.rdy .chip.rpop{animation:rdyPop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes rdyDot{50%{opacity:.25;transform:scale(.7)}}
@keyframes rdyPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
/* ===== volume popover ===== */
.volwrap{position:relative}
.volpop{position:absolute;right:0;top:calc(100% + 6px);z-index:9500;width:260px;padding:10px 12px;background:linear-gradient(180deg,#f8f0d4,#ede0b0);border:2px solid var(--rim);border-radius:10px;box-shadow:0 0 0 2px var(--wood),0 10px 22px #000a;color:var(--ink)}
.volpop[hidden]{display:none}
.volpop label{display:grid;grid-template-columns:50px 1fr 44px;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin:5px 0}
.volpop input{width:100%;accent-color:#9a6512;cursor:pointer}
.volpop b{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.volhint{font-size:11.5px;color:var(--mute);margin-top:4px}
/* ===== status effects, ported from battle mode (npc-status-strip.js / status-tip.js / status-cues.js) ===== */
.fxrow{display:flex;flex-wrap:nowrap;gap:3px;justify-content:center;min-height:24px;margin-top:5px;position:relative;z-index:3}
.fxt{--ac:#8a8a8a;position:relative;flex:none;width:23px;height:23px;box-sizing:border-box;border-radius:6px;border:2px solid var(--ac);background:#0d0b09;box-shadow:0 1px 2px rgba(0,0,0,.5);cursor:help}
.fxt img{display:block;width:100%;height:100%;max-width:none;border:0;border-radius:4px;object-fit:cover;image-rendering:auto}
.fxt b{position:absolute;right:-3px;bottom:-3px;min-width:11px;height:11px;padding:0 2px;box-sizing:border-box;border-radius:4px 0 3px 0;background:#000;color:#fff;font:700 9px/11px "Signika",sans-serif;text-align:center;pointer-events:none}
.fxt.t-debuff{--ac:#e05050}
.fxt.t-buff{--ac:#3fb67c}
.fxt.t-ready{--ac:#e2b34a;border-width:2px;box-shadow:0 0 0 1px rgba(255,236,170,.5) inset,0 0 8px rgba(226,179,74,.9);animation:fxReady 1.6s ease-in-out infinite}
.fxt.t-ready::after{content:"";position:absolute;right:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#ffd45a;box-shadow:0 0 4px #ffb800}
.fxt.t-spent{--ac:rgba(122,106,85,.6);box-shadow:none;filter:grayscale(1);opacity:.5}
.fxt.is-flash{animation:fuNstFlash .9s ease-out}
.fxt.t-ready.is-flash{animation:fuNstFlash .9s ease-out,fxReady 1.6s .9s ease-in-out infinite}
@keyframes fuNstFlash{0%{box-shadow:0 0 0 0 rgba(255,196,70,1)}100%{box-shadow:0 0 0 12px rgba(255,196,70,0)}}
@keyframes fxReady{50%{box-shadow:0 0 0 1px rgba(255,236,170,.6) inset,0 0 14px rgba(255,200,80,1)}}
.fxt:focus-visible{outline:2px solid #f4c95d;outline-offset:2px}
.ffx{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.ffw{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:8px;background:#1a120acc;color:#e9f9ef;font-family:var(--font-b);font-size:12px;font-weight:700;letter-spacing:.02em;box-shadow:0 1px 3px #0006}
.ffw.pend{opacity:.75}
em.sv{font-style:normal;font-weight:900;font-size:1.12em;border-radius:4px;padding:0 3px;cursor:help;box-shadow:inset 0 0 0 1px currentColor}
em.sv.up{color:#0f7a33;background:#c8f0d1}
em.sv.down{color:#b3261e;background:#ffd3cc}
em.sv.sv-flash{animation:fuNstFlash .9s ease-out}
/* battle tooltip (status-tip.js) */
#fxtip{position:fixed;left:0;top:0;z-index:10050;max-width:320px;padding:0;background:rgba(18,15,12,.96);border:1px solid #b7935a;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .12s;text-align:left}
#fxtip.on{opacity:1}
.fu-st-tip{--tc:rgba(122,106,85,.5);--tc2:#a8987e;color:#f3eee4;font:13px/1.45 "Signika",sans-serif;overflow:hidden;border-radius:6px}
.fu-st-tip.t-debuff{--tc:rgba(196,71,58,.5);--tc2:#e0675a} .fu-st-tip.t-buff{--tc:rgba(47,158,107,.5);--tc2:#4fc08d} .fu-st-tip.t-ready{--tc:rgba(226,179,74,.5);--tc2:#e2b34a}
.fu-st-tip .th{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:8px 11px;background:linear-gradient(90deg,var(--tc),rgba(18,15,12,0) 85%);border-bottom:1px solid rgba(213,182,122,.35)}
.fu-st-tip .th.nimg{grid-template-columns:1fr}
.fu-st-tip .th img{width:38px;height:38px;border-radius:7px;border:2px solid var(--tc2);background:#3a3228;object-fit:cover}
.fu-st-tip .th strong{display:block;font-size:14.5px;color:#fff3d6;line-height:1.2}
.fu-st-tip .th small{display:block;margin-top:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#d8c9ad}
.fu-st-tip .tb{padding:8px 11px 9px;display:grid;gap:6px}
.fu-st-tip .life{font-size:11.5px;color:#c9bca6}
.fu-st-tip .when{font-size:12px;color:#ffe2a8;border-left:2px solid #d5b67a;padding-left:7px}
.fu-st-k.pos{color:#ffd780;font-weight:700} .fu-st-k.neg{color:#ff9a8a;font-weight:700}
.fu-st-e{font-weight:700} .fu-st-e.e-fire{color:#ff9a5c} .fu-st-e.e-ice{color:#9fe3ff} .fu-st-e.e-bolt{color:#d7a6ff} .fu-st-e.e-air{color:#7fe0c0} .fu-st-e.e-earth{color:#f5c461} .fu-st-e.e-light{color:#fff2a8} .fu-st-e.e-dark{color:#c49cff} .fu-st-e.e-poison{color:#a6e06a} .fu-st-e.e-physical{color:#e8dcc6}
/* cues on the hologram (status-cues.js): Static sparks, Burn flames, power glow, Roo arrived */
.holo .cue{position:absolute;inset:0;pointer-events:none;z-index:2}
.holo:not(.on) .cue{display:none}
.holo .cue i,.holo .cue svg{position:absolute;display:block}
.holo .cue .zp{width:17px;height:27px;overflow:visible;opacity:0;animation:fuCueZap 1.6s steps(1) infinite;filter:drop-shadow(0 0 1px #6a3c00) drop-shadow(0 0 3px #ffd000) drop-shadow(0 0 8px #ff9a00)}
.holo .cue .zp polyline{fill:none;stroke:#fff36a;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
@keyframes fuCueZap{0%{opacity:0}8%{opacity:1}13%{opacity:0}17%{opacity:1}22%{opacity:0}100%{opacity:0}}
.holo .cue .fl{width:var(--s);height:calc(var(--s)*1.5);margin-left:calc(var(--s)*-.5);border-radius:50% 50% 42% 42%/66% 66% 34% 34%;background:radial-gradient(ellipse at 50% 70%,#fffbe0 0,#ffe06a 20%,#ff9a2a 45%,rgba(255,80,10,.85) 60%,rgba(255,60,0,0) 74%);filter:drop-shadow(0 0 4px rgba(255,120,20,.9));opacity:0;animation:fuCueFlame 1.1s ease-out infinite}
.holo .cue .gl{left:22%;right:22%;bottom:0;height:14%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,150,40,.7),rgba(255,90,0,0) 70%);animation:fuCueFlick .45s steps(2) infinite alternate}
@keyframes fuCueFlame{0%{transform:translateY(0) scale(.7);opacity:0}14%{opacity:1}100%{transform:translateY(-60px) scale(.15);opacity:0}}

  roper:    {name:'Roper', el:'phys', cost:2, role:'Punisher', atk:3, hp:11, def:1, ab:'Entangle', txt:'+1 ATK against a monster that entered by voluntary Switch this round.'},
  rgolem:   {name:'Rock Golem', el:'earth', cost:2, role:'Guardian', atk:2, hp:9, def:2, ab:'Wind Up', txt:'After it Passes, its next attack is an Earthquake: it also deals 1 damage to every benched enemy (does not stack).'},
  gigas:    {name:'Gigas', el:'earth', cost:3, role:'Striker', atk:4, hp:9, def:1, ab:'Crushing Blow', txt:'+1 ATK against a monster with printed DEF 1 or more.'},
  flame:    {name:'Wandering Flame', el:'fire', cost:3, role:'Pivot', atk:5, hp:11, def:0, ab:'Dynamic Entry', txt:'When it enters by voluntary Switch, it deals 2 Fire damage to the enemy active monster (ignores DEF and items).'},
  // ---- future unlocks / retired (never in the launch pool) ----
  roo:      {name:'Roo', el:'dark', cost:1, role:'Combo', atk:0, hp:12, def:2, ab:"Chef's Knife", txt:'It does not hurry and it does not stop: +1 step at the end of each round it stays on the field (steps reset if it leaves). On its 3rd round on the field it draws the knife: 9999 damage, then Roo walks away and leaves the duel.'},

  broo:     {future:true, retired:true, name:'Bandit Roo', el:'dark', cost:1, role:'Pivot', atk:3, hp:9, def:0, ab:'Soft Landing', txt:'Takes 2 less attack damage in a round it enters by voluntary Switch.'},
  gorger:   {name:'Aero Gorger', el:'air', cost:1, role:'Punisher', atk:3, hp:9, def:0, ab:'Aero Explosion', txt:'When an attack KOs it, it bursts: 2 damage to the attacker.'},

  life:     {future:true, name:'Life Gorger', el:'light', cost:1, role:'Survivor', atk:3, hp:10, def:0, ab:'Renewal', txt:'The first time it survives an attack at 4 HP or less, restore 2 HP. Once per match.'},

};
const IDS = Object.keys(CARDS).filter(k=>!CARDS[k].future);   // launch pool
// v0.5 Speed = DEX die tier (d6=1, d8=2, d10=3, d12=4) from the world sheets
const SPD = { gigas:1, gorger:2, carlbero:2, kirin:2, flame:2, cryo:2, sylph:2, fulgimite:3, broo:3, life:3, pyrefly:4, skizzik:4,
  salamander:2, manaray:3, hellhound:3, scorpion:2, archer:2, wolf:2, inferex:3, roper:2, obsidrax:2, roo:1, walrog:1, succubus:3, rgolem:1 };   // Roo SPD 1 by design (slow Tonberry), not its DEX die
for (const k of Object.keys(CARDS)) CARDS[k].spd = SPD[k];

  STRENGTH:{t:'Tincture of Strength', k:'Attack', d:`+${CFG.STR} ATK this round`, art:'i_strength'},

};

// ===================== helpers =====================
const $ = s => document.querySelector(s);

const sleep = ms => new Promise(r=>setTimeout(r, RM() ? Math.min(ms,60) : ms));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const N = cid => CARDS[cid].name;

// ===================== SFX (WebAudio, unlocked on first click) =====================

const SND = { on: store.get('ccd.sound', true), vol: 0.55, ctx: null, buf: {}, last: {} };
const MUS = { on: store.get('ccd.music', true), vol: 0.32, buf: {}, gain: null, src: [], playing: false };
// Volume sliders: LV = 0..1.5 per channel (1 = the default mix). SND.vol / MUS.vol read base × level; writes set the base.
const LV = Object.assign({ sfx:1, music:1 }, store.get('fa.vol', {}) || {});
for (const [o, k, b] of [[SND,'sfx',0.55],[MUS,'music',0.32]]) { let base=b; Object.defineProperty(o, 'vol', { get(){ return base*LV[k]; }, set(v){ base=v; }, configurable:true }); }
SND.on = SND.on && LV.sfx > 0; MUS.on = MUS.on && LV.music > 0;
function sndInit(){
  if (SND.ctx || (!SND.on && !MUS.on)) return;
  try { SND.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
  if (typeof BGMDATA!=='undefined' && BGMDATA) for (const [k,u] of Object.entries(BGMDATA)){
    try { const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for (let i=0;i<b.length;i++) a[i]=b.charCodeAt(i);
      SND.ctx.decodeAudioData(a.buffer).then(x=>{ MUS.buf[k]=x; if (MUS.buf.intro && MUS.buf.loop) musicStart(); }, ()=>{}); } catch(e){} }
  for (const [k,u] of Object.entries(SFXDATA)){
    try { const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for (let i=0;i<b.length;i++) a[i]=b.charCodeAt(i);
      SND.ctx.decodeAudioData(a.buffer).then(x=>{ SND.buf[k]=x; }, ()=>{}); } catch(e){}
  }
}
const SFX_ALIAS = { book:'nav' };   // 'nav' holds Book1 (card played / flipped); 'cursor' holds BattleCursor_2 (selection + menus)
function sfx(k, v=1, gap=60){
  k = SFX_ALIAS[k] || k;
  if (!SND.on || !SND.ctx) return; const now=performance.now(); if (SND.last[k] && now-SND.last[k]<gap) return; SND.last[k]=now;
  const b=SND.buf[k]; if (!b) return;
  try { if (SND.ctx.state==='suspended') SND.ctx.resume(); const s=SND.ctx.createBufferSource(), g=SND.ctx.createGain(); g.gain.value=SND.vol*v; s.buffer=b; s.connect(g).connect(SND.ctx.destination); s.start(); } catch(e){}
}
function musicStart(){ if (!MUS.on || MUS.playing || !SND.ctx || !MUS.buf.loop) return;
  try { const c=SND.ctx; if (c.state==='suspended') c.resume(); MUS.gain=c.createGain(); MUS.gain.gain.value=MUS.vol; MUS.gain.connect(c.destination);
    const t0=c.currentTime+0.05; let tLoop=t0;
    if (MUS.buf.intro){ const i=c.createBufferSource(); i.buffer=MUS.buf.intro; i.connect(MUS.gain); i.start(t0); MUS.src.push(i); tLoop=t0+MUS.buf.intro.duration; }
    const l=c.createBufferSource(); l.buffer=MUS.buf.loop; l.loop=true; l.connect(MUS.gain); l.start(tLoop); MUS.src.push(l); MUS.playing=true; } catch(e){} }
function musicStop(){ for (const s of MUS.src) try{ s.stop(); }catch(e){} MUS.src=[]; MUS.playing=false; if (MUS.gain) try{ MUS.gain.disconnect(); }catch(e){} MUS.gain=null; }
function musicDuck(on){ if (!MUS.gain || !SND.ctx) return; const t=SND.ctx.currentTime; MUS.gain.gain.cancelScheduledValues(t); MUS.gain.gain.setTargetAtTime(on?MUS.vol*0.25:MUS.vol, t, on?0.08:0.6); }
const HITSND = { fire:'hit_fire', bolt:'hit_bolt', ice:'hit_ice', air:'hit_wind', earth:'hit_earth', dark:'hit_dark', light:'hit_light', poison:'hit_poison' };
