  return { roster: ids.map((cid,i)=>({ i, cid, hp:CARDS[cid].hp, ko:false, abilityUsed:false, attacked:false, activeRounds:0 })),
           active:null, items:{STRENGTH:1,GOLEM:1,REMEDY:1,SMOKE:1,SHARD:1,CAFE:1}, pending:false };
}
const mon = (pl, idx) => idx==null ? null : pl.roster[idx];
const living = pl => pl.roster.filter(m=>!m.ko);
const benchOptions = pl => pl.roster.filter(m => !m.ko && m.i!==pl.active);
const teamCost = ids => ids.reduce((a,id)=>a+CARDS[id].cost,0);
const LEGAL_TEAMS = (()=>{ const out=[]; for (let a=0;a<IDS.length;a++) for (let b=a+1;b<IDS.length;b++) for (let c=b+1;c<IDS.length;c++){ const t=[IDS[a],IDS[b],IDS[c]]; if (teamCost(t)<=CFG.BUDGET) out.push(t); } return out; })();
const randomTeam = () => shuffle(LEGAL_TEAMS[Math.floor(Math.random()*LEGAL_TEAMS.length)]);
const compKey = ids => ids.map(id=>CARDS[id].cost).sort((a,b)=>b-a).join('+');

// ===================== rules engine (v0.2) =====================
// ctx: {attItem, defItem, defSwitchedIn}
function calcAttack(att, def, ctx){
  const A=CARDS[att.cid], D=CARDS[def.cid];
  const ael = ctx.attItem==='SHARD' ? 'none' : A.el;
  let atk=A.atk; const parts=[`${A.atk} ATK`];
  if (ctx.attItem==='STRENGTH'){ atk+=CFG.STR; parts.push(`+${CFG.STR} Strength`); }
  if (ctx.attItem==='SHARD'){ atk+=CFG.SHARD; parts.push(`+${CFG.SHARD} Shard`); }
  const pyre = att.cid==='pyrefly' && ((att.burn||{})[def.i]||0)>=CFG.PYRE_N; if (pyre){ atk+=CFG.PYRE_BURST; parts.push(`+${CFG.PYRE_BURST} Funeral Pyre`); }
  const kcharge = att.cid==='kirin' && !!(att.chg && att.chg[S.round]); if (kcharge){ atk+=CFG.KCHARGE; parts.push(`+${CFG.KCHARGE} Lightning Charge`); }
  if (att.cid==='gigas' && D.def>=1){ atk+=1; parts.push('+1 Crushing Blow'); }
  if (att.cid==='manaray' && ITEMS[ctx.defItem]){ atk+=1; parts.push('+1 Mana Catcher'); }
  if (att.cid==='hellhound' && def.hp*2<=D.hp){ atk+=1; parts.push('+1 On the Hunt'); }
  if (att.cid==='roper' && ctx.defSwitchedIn){ atk+=1; parts.push('+1 Entangle'); }
  const howl = att.cid==='wolf' && !!att.howl; if (howl){ atk+=1; parts.push('+1 Howl'); }
  if ((att.charm||0)>=S.round){ atk=Math.max(0,atk-CFG.CHARM); parts.push(`−${CFG.CHARM} Charm`); }
  const head = `${parts.join(' ')} = ${atk} ${EL[ael]}`;
  // absorption ability: checked before damage (fires even if Guard would zero it)
  if (D.absorb && D.absorb===ael && !def.abilityUsed)
    return { dmg:0, heal:CFG.AB_HEAL, aff:'AB', line:`${head} · ${N(def.cid)}'s <b>${D.ab}</b> negates it (+${CFG.AB_HEAL} HP)`, usedAbsorb:true, howl, pyre, kcharge, ael };
  let d = Math.max(1, atk - D.def); let line = head + (D.def?` − DEF ${D.def}`:'') + ` = ${d}`;
  const mod = elMod(ael, D.el); let aff = ael==='none' ? 'NONE' : 'N';
  if (mod>0){ d=Math.max(1,d+mod); aff='ADV'; line+=` · <b>Strong</b> vs ${EL[D.el]} +${mod} = ${d}`; }
  if (mod<0){ d=Math.max(1,d+mod); aff='DIS'; line+=` · <b>Weak</b> vs ${EL[D.el]} ${mod} = ${d}`; }
  const red=[]; let r=0;
  if (ctx.defItem==='GOLEM'){
    if (ctx.attItem==='SMOKE') red.push('Golem Fragment pierced by Smoke Bomb'); else { r+=CFG.GOLEM; red.push(`Golem Fragment −${CFG.GOLEM}`); }
    if (def.cid==='carlbero'){ r+=1; red.push('Fortify −1'); }
  }
  if (def.cid==='broo' && ctx.defSwitchedIn){ r+=2; red.push('Soft Landing −2'); }
  if (def.cid==='fulgimite' && ctx.defSwitchedIn){ r+=2; red.push('Evasion −2'); }
  d = Math.max(0, d-r);
  let usedFirst=false;
  let prevented=0;
  if (def.cid==='walrog' && !def.abilityUsed && d>0){ prevented=Math.min(3,d); d=Math.max(0,d-3); usedFirst=true; red.push('Thick Skin −3'); }
  if (def.cid==='salamander' && !def.abilityUsed && ael==='fire' && d>0){ prevented=Math.min(2,d); d=Math.max(0,d-2); usedFirst=true; red.push('Pyrophagy −2'); }
  let usedOwn=false;
  if (att.cid==='scorpion' && !att.abilityUsed && d>=1){ d+=CFG.VENOM; usedOwn=true; red.push(`Venom Sting +${CFG.VENOM}`); }
  let zap=false; if (att.cid==='skizzik' && (att.static||0)>=2 && d>0){ d+=3; zap=true; red.push('Static Buildup +3'); }
  let knife=false; if (att.cid==='roo' && CFG.ROO_BENCH ? (att.walk||0)>=(CFG.ROO_BENCH===2?CFG.ROO_STEPS:3) && !(CFG.ROO_GOLEM && ctx.defItem==='GOLEM') : att.cid==='roo' && (CFG.ROO_MARK ? ((att.marks||{})[def.i]||0)>=2 : (att.steps && att.steps.t===def.i && att.steps.n>=2))){ d+=CFG.KNIFE; knife=true; red.push(`Chef's Knife +${CFG.KNIFE}`); }
  let wire=0; if (def.cid==='obsidrax' && !def.abilityUsed && ael==='bolt' && d>0){ wire=d; d=0; usedFirst=true; red.push('Earthen Wire grounds it'); }
  if (red.length) line += ` · ${red.join(', ')}`;
  return { dmg:d, heal:0, aff, line, usedFirst, usedOwn, howl, pyre, kcharge, zap, knife, wire, ael, prevented, pierced: ctx.defItem==='GOLEM' && ctx.attItem==='SMOKE' };
}

function resolveRound(ch){
  const P=S.p, L=[], ev={ enter:[null,null], switched:[false,false], items:[null,null], heal:[0,0], res:[null,null], after:[[],[]], ko:[false,false] };
  const who = s => s===0?'You':'NPC';
  for (const s of [0,1]) if (P[s].pending){
    P[s].active=ch[s].replace; P[s].pending=false; S.stats.forced[s]++; ev.enter[s]='forced';
    L.push([`${who(s)} send${s?'s':''} in ${N(mon(P[s],P[s].active).cid)}.`,'m']);
  }
  for (const s of [0,1]) if (ch[s].action==='SWITCH'){
    const out=mon(P[s],P[s].active); if (CFG.ROO_BENCH===2 && out.cid==='roo' && out.walk){ out.walk=0; L.push(['Roo leaves the field and loses its steps.','m']); } P[s].active=ch[s].target; ev.switched[s]=true; ev.enter[s]='switch'; S.stats.switches[s]++;
    L.push([`${who(s)} switch${s?'es':''} ${N(out.cid)} out for ${N(mon(P[s],P[s].active).cid)}. It skips its attack.`,'m']);
  }
  for (const s of [0,1]) if (ev.switched[s] && mon(P[s],P[s].active).cid==='succubus'){ const t=mon(P[1-s],P[1-s].active); if (t && t.hp>0){ t.charm=S.round+1; S.stats.charm=(S.stats.charm||0)+1; L.push([`Charm: ${N(t.cid)} is Charmed (−${CFG.CHARM} ATK this round and next).`,'m']); } }
  for (const s of [0,1]) if (ev.switched[s] && mon(P[s],P[s].active).cid==='flame'){ const t=mon(P[1-s],P[1-s].active); if (t && t.hp>0){ const b=t.hp; t.hp=Math.max(0,t.hp-CFG.ENTRY); (ev.entry=ev.entry||[]).push({s:1-s,amt:b-t.hp}); S.stats.entry=(S.stats.entry||0)+1;
      L.push([`Dynamic Entry: Wandering Flame bursts in, ${b-t.hp} Fire damage to ${N(t.cid)} (${t.hp} HP).`,'']); } }
  for (const s of [0,1]){ const a=ch[s].action; S.stats.acts[s][a]=(S.stats.acts[s][a]||0)+1; if (ITEMS[a]){ P[s].items[a]=0; ev.items[s]=a; } }
  for (const s of [0,1]) if (ch[s].action==='PASS'){ const m=mon(P[s],P[s].active); if (m.cid==='wolf' && !m.howl){ m.howl=true; L.push(['Wolf howls: its next attack gets +1 ATK.','m']); }
    if (m.cid==='rgolem' && !m.windup){ m.windup=true; L.push(['Rock Golem winds up: its next attack will be an Earthquake.','m']); } }
  const startHP=[0,1].map(s=>mon(P[s],P[s].active).hp);
  for (const s of [0,1]) if (ch[s].action==='REMEDY'){
    const m=mon(P[s],P[s].active), amt=CFG.REMEDY, b=m.hp;
    m.hp=Math.min(CARDS[m.cid].hp, m.hp+amt); ev.heal[s]=m.hp-b;
    L.push([`${N(m.cid)} drinks a Remedy: +${ev.heal[s]} HP → ${m.hp}.`,'g']);
  }
  for (const s of [0,1]) if (['STRENGTH','GOLEM','SMOKE','SHARD'].includes(ch[s].action)) L.push([`${who(s)} use${s?'s':''} ${ITEMS[ch[s].action].t}.`,'m']);
  for (const s of [0,1]){ const m=mon(P[s],P[s].active); m.activeRounds++; }
  const preHP=[0,1].map(s=>mon(P[s],P[s].active).hp); // v0.4 tiebreak snapshot (after Remedy, before impact)
  // ---- attack phase (v0.5): equal Speed = simultaneous; otherwise the faster attack fully resolves first ----
  const directHit = (s, amt, src, withActive) => { const pl=P[s]; const c=pl.roster.filter(m=>!m.ko && m.hp>0 && (withActive || m.i!==pl.active)); if (!c.length) return null;
    const m=c[Math.floor(Math.random()*c.length)]; m.hp=Math.max(0,m.hp-amt); (ev.direct=ev.direct||[]).push({s,i:m.i,amt,src}); S.stats.direct=S.stats.direct||{}; S.stats.direct[src]=(S.stats.direct[src]||0)+1;
    const bench=m.i!==pl.active; L.push([`${src}: ${amt} damage to ${bench?'benched ':''}${N(m.cid)} (${m.hp} HP).`,'']);
    if (m.hp===0 && bench){ m.ko=true; ev.benchKO=(ev.benchKO||0)+1; S.stats.kos.push(m.cid); L.push([`${N(m.cid)} is knocked out on the bench!`,'k']); }
    return m; };
  const calcFor = s => { const o=1-s, a=mon(P[s],P[s].active), d=mon(P[o],P[o].active);
    return { ...calcAttack(a,d,{attItem:ch[s].action, defItem:ch[o].action, defSwitchedIn:ev.switched[o]}), a, d, side:s }; };
  const applyHit = r => {
    if (r.heal){ const b=r.d.hp; r.d.hp=Math.min(CARDS[r.d.cid].hp, r.d.hp+r.heal); r.healed=r.d.hp-b; }
    else r.d.hp=Math.max(0, r.d.hp-r.dmg);
    r.a.attacked=true; if (r.usedOwn) r.a.abilityUsed=true; if (r.howl){ r.a.howl=false; S.stats.howl=(S.stats.howl||0)+1; }
    if (r.a.cid==='pyrefly'){ r.a.burn=r.a.burn||{}; if (r.pyre){ r.a.burn[r.d.i]=0; S.stats.pyre=(S.stats.pyre||0)+1; } else if (r.dmg>0) r.a.burn[r.d.i]=Math.min(CFG.PYRE_N,(r.a.burn[r.d.i]||0)+1); if (r.d.hp===0) delete r.a.burn[r.d.i]; }
    if (r.a.cid==='skizzik' && r.dmg>0){ r.a.static = r.zap ? 0 : Math.min(2,(r.a.static||0)+1); if (r.zap) S.stats.zap=(S.stats.zap||0)+1; }
    if (r.a.cid==='roo' && CFG.ROO_BENCH){ if (r.knife){ r.a.walk=0; r.a.leaving=!!CFG.ROO_LEAVE; S.stats.knife=(S.stats.knife||0)+1; } else if (CFG.ROO_GOLEM && (r.a.walk||0)>=(CFG.ROO_BENCH===2?CFG.ROO_STEPS:3)){ r.a.walk=0; L.push(['Golem Fragment turns the knife aside!','m']); } }
    else if (r.a.cid==='roo'){ if (r.knife){ r.a.steps=null; if (r.a.marks) r.a.marks[r.d.i]=0; r.a.leaving=!!CFG.ROO_LEAVE; S.stats.knife=(S.stats.knife||0)+1; }
      else { if (CFG.ROO_MARK){ r.a.marks=r.a.marks||{}; r.a.marks[r.d.i]=(r.a.marks[r.d.i]||0)+1; }
        const st=r.a.steps; r.a.steps = (st && st.t===r.d.i) ? {t:r.d.i, n:st.n+1} : {t:r.d.i, n:(CFG.ROO_MARK?r.a.marks[r.d.i]:1)}; L.push([`Roo takes a step toward ${N(r.d.cid)} (${r.a.steps.n}/3).`,'m']); } }
    if (r.kcharge){ delete r.a.chg[S.round]; S.stats.kcharge=(S.stats.kcharge||0)+1; }
    if (r.d.cid==='kirin' && r.dmg>0 && r.d.hp>0 && !r.heal){ r.d.chg=r.d.chg||{}; r.d.chg[S.round+1]=true; L.push([`Lightning Charge: Kirin is charged (+${CFG.KCHARGE} ATK next round).`,'m']); }
    if (false && r.a.cid==='sylph' && r.dmg>0 && r.d.hp>0){ r.d.slowRound=S.round+1; S.stats.gust=(S.stats.gust||0)+1; L.push([`Gust: ${N(r.d.cid)} will be −1 SPD next round.`,'m']); }
    if (r.a.cid==='sylph'){ P[r.side].twFrom=S.round+1; P[r.side].twUntil=S.round+CFG.TAILWIND; S.stats.twSet=(S.stats.twSet||0)+1; L.push([`Tailwind: ${CFG.TW_ALL?'your monsters':'your Air monsters'} get +1 SPD for ${CFG.TAILWIND} rounds.`,'m']); }
    if (r.a.cid==='archer') directHit(1-r.side, 1, 'Double Strafe', false);
    if (r.a.cid==='rgolem' && r.a.windup){ r.a.windup=false; S.stats.quake=(S.stats.quake||0)+1; const pl=P[1-r.side]; L.push(['Earthquake!','m']);
      for (const m of pl.roster) if (!m.ko && m.hp>0 && m.i!==pl.active){ m.hp=Math.max(0,m.hp-1); (ev.direct=ev.direct||[]).push({s:1-r.side,i:m.i,amt:1,src:'Earthquake'}); L.push([`Earthquake: 1 damage to benched ${N(m.cid)} (${m.hp} HP).`,'']);
        if (m.hp===0){ m.ko=true; ev.benchKO=(ev.benchKO||0)+1; S.stats.kos.push(m.cid); L.push([`${N(m.cid)} is knocked out on the bench!`,'k']); } } }
    if (r.wire) directHit(r.side, r.wire, 'Earthen Wire', true); if (r.usedFirst||r.usedAbsorb) r.d.abilityUsed=true;
    if (r.d.cid==='cryo' && r.usedFirst){ S.stats.frost=S.stats.frost||[0,0]; S.stats.frost[0]++; S.stats.frost[1]+=r.prevented; }
    S.stats.aff[r.aff]=S.stats.aff[r.aff]||[0,0]; S.stats.aff[r.aff][0]++; S.stats.aff[r.aff][1]+=r.dmg;
    L.push([`${N(r.a.cid)}: ${r.line} → ${r.heal?`<b>heals ${r.healed}</b>`:`<b>${r.dmg}</b> damage`} (${N(r.d.cid)} ${r.d.hp} HP).`,'']);
    if (r.undying) L.push(['Undying Flame: Inferex refuses to fall and stays at 1 HP.','g']);
  };
  const afterHit = r => { const s=r.side;
    if ((r.d.cid==='cryo'||r.d.cid==='gorger') && r.d.hp===0 && !r.heal && r.a.hp>0){ const b=r.a.hp; r.a.hp=Math.max(0,r.a.hp-2); S.stats.cryoX=(S.stats.cryoX||0)+1; ev.after[1-s].push(['burst',b-r.a.hp]); L.push([`${r.d.cid==='cryo'?'Cryo':'Aero'} Explosion: ${N(r.a.cid)} takes ${b-r.a.hp} → ${r.a.hp} HP.`,'k']); }
    if (false && r.a.cid==='gorger' && r.d.hp===0 && r.a.hp>0){ const b=r.a.hp; r.a.hp=Math.min(CARDS.gorger.hp,r.a.hp+2); if (r.a.hp>b){ ev.after[s].push(['heal',r.a.hp-b]); L.push([`Devour: Aero Gorger +${r.a.hp-b} HP → ${r.a.hp}.`,'g']); } }
    if (r.d.cid==='life' && !r.d.abilityUsed && r.dmg>0 && r.d.hp>0 && r.d.hp<=4){ const b=r.d.hp; r.d.hp=Math.min(CARDS.life.hp,r.d.hp+2); r.d.abilityUsed=true; ev.after[1-s].push(['heal',r.d.hp-b]); L.push([`Renewal: Life Gorger +${r.d.hp-b} HP → ${r.d.hp}.`,'g']); }
  };
  const snap = () => [0,1].map(s=>mon(P[s],P[s].active).hp);
  const canAtk=[0,1].map(s=>!ev.switched[s] && mon(P[s],P[s].active).hp>0);
  if (!canAtk[0]&&!canAtk[1]) L.push(['Both sides switched. No attacks this round.','m']);
  const baseSp=[0,1].map(s=>{ const m=mon(P[s],P[s].active); const tw = (CFG.TW_ALL || CARDS[m.cid].el==='air') && P[s].twFrom<=S.round && S.round<=P[s].twUntil ? 1 : 0;
    if (tw){ S.stats.tailwind=(S.stats.tailwind||0)+1; } return Math.min(4, Math.max(1, CARDS[m.cid].spd + tw - (m.slowRound===S.round?1:0))); });
  const sp=[0,1].map(s=>Math.min(4, baseSp[s] + (ch[s].action==='CAFE'?1:0)));   // Café au Lait: +1 SPD this round, cap 4
  for (const s of [0,1]) if (ch[s].action==='CAFE'){ const changed=(Math.sign(baseSp[s]-baseSp[1-s])!==Math.sign(sp[s]-baseSp[1-s])); S.stats.cafe=S.stats.cafe||{used:0,changed:0,capped:0}; S.stats.cafe.used++; if (changed) S.stats.cafe.changed++; if (baseSp[s]>=4) S.stats.cafe.capped++;
    L.push([`${N(mon(P[s],P[s].active).cid)} drinks Café au Lait: SPD ${baseSp[s]} → ${sp[s]}${baseSp[s]>=4?' (already at max)':''}.`,'m']); }
  if (canAtk[0]&&canAtk[1]&&sp[0]!==sp[1]){
    const first=sp[0]>sp[1]?0:1, second=1-first;
    ev.seq=[]; ev.snaps=[];
    L.push([`${N(mon(P[first],P[first].active).cid)} is faster (SPD ${sp[first]} vs ${sp[second]}) and strikes first.`,'m']);
    const r1=calcFor(first); ev.res[first]=r1; applyHit(r1); afterHit(r1); ev.seq.push(first); ev.snaps.push(snap());
    if (mon(P[second],P[second].active).hp>0){ const r2=calcFor(second); ev.res[second]=r2; applyHit(r2); afterHit(r2); ev.seq.push(second); ev.snaps.push(snap()); }
    else { ev.denied=second; S.stats.firstStrike=(S.stats.firstStrike||0)+1; L.push([`${N(mon(P[second],P[second].active).cid)} falls before it can strike back.`,'k']); }
  } else {
    for (const s of [0,1]) if (canAtk[s]) ev.res[s]=calcFor(s);   // computed on the shared pre-impact state
    for (const s of [0,1]) if (ev.res[s]) applyHit(ev.res[s]);
    for (const s of [0,1]) if (ev.res[s]) afterHit(ev.res[s]);
  }
  for (const s of [0,1]){ const r=ev.res[s]; if (r && r.a.cid==='inferex' && r.d.hp===0 && r.a.hp>0 && !r.heal) directHit(1-s, CFG.VORACIOUS, 'Voracious', false); }
  // zero-progress round classification (ChatGPT metric)
  { const z=S.stats.zero; const totalDmg=[0,1].reduce((a,s)=>a+(ev.res[s]?ev.res[s].dmg:0),0);
    const netLoss=[0,1].map(s=>startHP[s]-mon(P[s],P[s].active).hp);
    if (ev.switched[0]&&ev.switched[1]) z.bothSwitch++;
    else if (totalDmg===0) z.noHpLost++;
    else if (netLoss[0]<=0 && netLoss[1]<=0) z.healedBack++; }
  if (CFG.ROO_BENCH) for (const s of [0,1]) for (const m of P[s].roster) if (m.cid==='roo' && !m.ko && m.hp>0 && !m.leaving && (CFG.ROO_BENCH!==2 || m.i===P[s].active)){
    const need = CFG.ROO_BENCH===2 ? CFG.ROO_STEPS : 3; const b=m.walk||0; m.walk=Math.min(need,b+1);
    if (m.walk!==b) L.push([`Roo takes a step (${m.walk}/${need})${m.walk===need?': its next attack draws the knife.':'.'}`,'m']); }
  for (const s of [0,1]){ const m=mon(P[s],P[s].active); if (m && m.leaving){ m.leaving=false; const oppLeft=P[1-s].roster.some(x=>!x.ko && x.hp>0);
      if (oppLeft){ m.hp=0; L.push(['Roo puts the knife away, walks off, and is gone from the duel.','m']); } } }
  // KO
  for (const s of [0,1]){ const m=mon(P[s],P[s].active); if (m.hp<=0 && !m.ko){ m.ko=true; ev.ko[s]=true; S.stats.kos.push(m.cid); L.push([`${N(m.cid)} is knocked out!`,'k']); } }
  const out0=living(P[0]).length===0, out1=living(P[1]).length===0;
  if (out0&&out1){
    S.stats.mutualFinal=true;
    if (preHP[0]!==preHP[1]){ S.result = preHP[0]>preHP[1]?'WIN':'LOSS'; S.tiebreak=preHP; S.stats.tiebroken=true;
      L.push([`Both last monsters fall together. Tiebreak on HP before impact: ${preHP[0]} vs ${preHP[1]} → <b>${preHP[0]>preHP[1]?'You win':'NPC wins'}</b>.`,'m']); }
    else { S.result='DRAW'; L.push([`Both last monsters fall together with equal HP (${preHP[0]}). It's a draw.`,'m']); }
  }
  else if (out0||out1){ S.result = out1?'WIN':'LOSS'; }
  else {
    for (const s of [0,1]) if (mon(P[s],P[s].active).ko) P[s].pending=true;
    if (S.round>=CFG.ROUND_CAP){
      const a=living(P[0]).length, b=living(P[1]).length; S.capEnd=true;
      S.result = a>b?'WIN':a<b?'LOSS':'DRAW';
      L.push([`Round ${CFG.ROUND_CAP} limit: ${a} vs ${b} monsters standing.`,'m']);
    }
  }
  return { L, ev };
}

// ===================== NPC AI (public info only, commits before reading the player's pick) =====================
function est(att, def, attItem='PASS', defItem='PASS', defSwitchedIn=false){ const r=calcAttack(att,def,{attItem,defItem,defSwitchedIn}); return r.dmg - r.heal; }
function aiChoose(me, op, prof={diff:'casual', style:null}){
  const D=AI_DIFF[prof.diff]||AI_DIFF.casual, ST=AI_STYLE[prof.style]||{};
  const noise=()=>1-D.noise*1.6+Math.random()*D.noise*3.2;
  const choice={action:'PASS'};
  let opMon=mon(op,op.active);
  if (!opMon||opMon.ko) opMon=[...living(op)].sort((a,b)=>CARDS[b.cid].atk-CARDS[a.cid].atk)[0];
  // Skilled AI reasons about Speed: a faster monster that KOs first takes no counter-hit
  const faster = m => D.speed && CARDS[m.cid].spd>CARDS[opMon.cid].spd;
  const slower = m => D.speed && CARDS[m.cid].spd<CARDS[opMon.cid].spd;
  const score = m => { const o=est(m,opMon), i=est(opMon,m); return o*1.2 - ((faster(m)&&o>=opMon.hp)?0:i) + m.hp*0.2 + (D.speed?(CARDS[m.cid].spd-CARDS[opMon.cid].spd)*0.4:0); };
  if (me.pending){ let best=null,bs=-1e9; for (const m of benchOptions(me)){ const sc=score(m)*noise(); if (sc>bs){bs=sc;best=m;} } choice.replace=best.i; }
  const my = me.pending ? me.roster[choice.replace] : mon(me,me.active);
  const max=CARDS[my.cid].hp, out=est(my,opMon);
  const killsFirst = faster(my) && out>=opMon.hp;           // incoming damage never lands
  const inc = killsFirst ? 0 : est(opMon,my);
  const incS = killsFirst ? 0 : est(opMon,my, op.items.STRENGTH?'STRENGTH':'PASS');
  const w={ PASS:1 + (killsFirst?2.5:0) };
  if (my.cid==='wolf' && !my.howl) w.PASS+=0.8;
  if (my.cid==='rgolem' && !my.windup) w.PASS+=0.8;
  const twOn = me.twUntil>=S.round+1;   // Tailwind still up next round
  if (slower(my) && my.hp<=incS) w.PASS*=0.6;                // about to be KO'd with no reply
  if (me.items.STRENGTH){ const outS=est(my,opMon,'STRENGTH'); w.STRENGTH = 0.6 + (opMon.hp>out && opMon.hp<=outS ? 3 : 0) + (my.cid==='fulgimite'?0.6:0) - (out<=0?0.6:0); }
  if (me.items.GOLEM) w.GOLEM = 0.4 + (my.hp<=incS && incS>0 ? 2.4 : 0) + (my.cid==='carlbero'?0.5:0) - (inc<=0?0.4:0);
  if (me.items.REMEDY) w.REMEDY = my.hp>=max-1 ? 0 : 0.3 + (my.hp<=max/2?1.8:0) + (my.hp<=incS && my.hp+CFG.REMEDY>incS ? 1.2 : 0) + (my.cid==='kirin'?0.4:0);
  if (me.items.SMOKE) w.SMOKE = 0.1 + (op.items.GOLEM && opMon.hp<=out+1 && out>0 ? 2 : 0);
  if (me.items.CAFE){ const ms=CARDS[my.cid].spd, os=CARDS[opMon.cid].spd; w.CAFE = 0.2 + (ms<4 && ms+1>os && ms<=os && out>=opMon.hp ? 2.6 : 0) + (ms<4 && ms+1===os && my.hp<=incS ? 0.8 : 0); }
  if (me.items.SHARD){ const outX=est(my,opMon,'SHARD'); w.SHARD = 0.3 + Math.max(0,outX-out)*0.9 + (opMon.hp>out && opMon.hp<=outX ? 2 : 0); }
  if (!me.pending){
    const bench=benchOptions(me);
    if (bench.length){
      let best=null,bs=-1e9;
      for (const m of bench){ const ci=est(opMon,m,'PASS','PASS',true); const sc=(est(m,opMon)*1.0 - ci*1.3 + (ci<m.hp?1:-3))*noise(); if (sc>bs){bs=sc;best=m;} }
      const ci=est(opMon,best,'PASS','PASS',true);
      w.SWITCH = 0.08 + (my.hp<=inc && ci<best.hp ? 1.1 : 0) + Math.max(0,(inc-ci))*0.2 + (out<=0?1.5:0) + Math.max(0, est(best,opMon)-out)*0.15;
      if (best.cid==='flame') w.SWITCH += 0.5;
      if (best.cid==='succubus') w.SWITCH += 0.5;
      if (my.cid==='sylph' && twOn && (CFG.TW_ALL || CARDS[best.cid].el==='air')) w.SWITCH += 0.9;   // set up, then switch
      if (op.active!=null && mon(op,op.active).cid==='roo' && mon(op,op.active).steps && mon(op,op.active).steps.t===my.i && mon(op,op.active).steps.n>=2) w.SWITCH += 3;   // dodge the knife
      choice.target=best.i;
    }
  }
  for (const k of Object.keys(w)) w[k]=Math.max(0,w[k])*(ST[k]||1);
  const keys=Object.keys(w).filter(k=>w[k]>0);
  let pick;
  if (Math.random()<D.rand+(ST.rand||0)) pick=keys[Math.floor(Math.random()*keys.length)];
  else { const ws=keys.map(k=>w[k]*noise()); let tot=ws.reduce((a,b)=>a+Math.max(0,b),0), r=Math.random()*tot; pick=keys[keys.length-1]; for (let i=0;i<keys.length;i++){ r-=Math.max(0,ws[i]); if (r<=0){pick=keys[i];break;} } }
  choice.action=pick; if (pick==='SWITCH'&&choice.target==null) choice.action='PASS';
  if (D.lookahead && S) return lookaheadPick(me, op, D, ST, choice);
  return choice;
}
// Skilled AI: one-round lookahead. Plays each of its legal moves against every legal opponent move on a copy of the
// board (public info only: the opponent's move is unknown, so all are weighed equally) and keeps the best average.
function legalMoves(pl, replace){
  const out=[{action:'PASS', replace}];
  for (const k of Object.keys(pl.items)) if (pl.items[k]) out.push({action:k, replace});
  if (!pl.pending) for (const m of benchOptions(pl)) out.push({action:'SWITCH', target:m.i});
  return out;
}
function boardValue(sm, so){ const hp=pl=>pl.roster.reduce((a,m)=>a+(m.ko?0:m.hp),0), ko=pl=>pl.roster.filter(m=>m.ko).length;
  return hp(sm)-hp(so) + 6*(ko(so)-ko(sm)); }
function lookaheadPick(me, op, D, ST, fallback){
  const si = S.p[0]===me ? 0 : 1;
  const mine = legalMoves(me, fallback.replace);
  const theirs = legalMoves(op, op.pending ? autoPickMonster(op) : undefined);
  const saved=S, v0=boardValue(me, op);
  let best=fallback, bs=-1e9;
  for (const c of mine){
    let tot=0;
    for (const o of theirs){
      const clone=JSON.parse(JSON.stringify(saved)); clone.log=[]; S=clone;
      try { resolveRound(si===0?[c,o]:[o,c]); } catch(e){}
      const sm=clone.p[si], so=clone.p[1-si];
      let v=boardValue(sm, so)-v0;
      if (clone.result){ const won=(clone.result==='WIN')===(si===0); v += clone.result==='DRAW'?0:(won?60:-60); }
      tot+=v; S=saved;
    }
    let sc = tot/theirs.length;
    if (ITEMS[c.action]) sc -= 0.9;                                  // spending a one-use item has a cost
    sc *= 1; sc += ((ST[c.action]||1)-1)*1.5;                         // play-style bias
    sc += (Math.random()-0.5)*D.noise*6;                              // decision noise
    if (sc>bs){ bs=sc; best=c; }
  }
  S=saved;
  return { ...best, replace: fallback.replace };
}
function aiOpening(me, prof={diff:'casual'}){ const sk=(AI_DIFF[prof.diff]||{}).speed; let best=0,bs=-1e9; for (const m of me.roster){ const c=CARDS[m.cid]; const sc=(c.atk*1.4+c.hp*0.35+c.def+(sk?c.spd*0.6:0))*(0.7+Math.random()*0.6); if (sc>bs){bs=sc;best=m.i;} } return best; }
// v0.5 timeout auto-pick: highest current HP, then highest max HP, then roster order (deterministic)
function autoPickMonster(pl){ const c=pl.roster.filter(m=>!m.ko && m.i!==pl.active); c.sort((a,b)=>(b.hp-a.hp)||(CARDS[b.cid].hp-CARDS[a.cid].hp)||(a.i-b.i)); return c[0].i; }

// ===================== match flow =====================
function newMatch(next){
  let mine=(UI.pick||[]).filter(id=>CARDS[id]); if (mine.length!==CFG.TEAM || teamCost(mine)>CFG.BUDGET) mine=randomTeam();
  if (!next || !SERIES || SERIES.over){ const npc0=randomTeam(); SERIES={ bestOf:UI.bestOf||1, need:Math.ceil((UI.bestOf||1)/2), wins:[0,0], game:0, draws:0, npc:npc0, over:false,
      prize: UI.matchType==='prize' ? npc0[Math.floor(Math.random()*npc0.length)] : null }; }
  SERIES.game++; const npc=SERIES.npc;
  S={ phase:'opening', round:0, p:[mkPlayer(mine), mkPlayer(npc)], log:[], result:null, capEnd:false,
      prize: SERIES.prize,
      ctrl: UI.opp.ctrl, ctrlQueued:null, prof:{ diff:UI.opp.diff, style:UI.opp.style==='random'?shuffle(Object.keys(AI_STYLE))[0]:UI.opp.style },
      commit:[null,null], justPlaced:null, deadline:null, timeouts:0, takeovers:0,
      t0:Date.now(), stats:{ acts:[{},{}], switches:[0,0], forced:[0,0], kos:[], aff:{}, zero:{bothSwitch:0,noHpLost:0,healedBack:0} } };
  clearDrafts(); Object.assign(UI,{busy:false,survey:{},notes:'',inspect:{s:0,i:0},seat:0});
  addLog('SETUP',[[`Both teams are public. Opponent: ${S.ctrl==='gm'?'GM-controlled NPC (30s timer)':`AI · ${S.prof.diff} · ${S.prof.style}`}. Click one of your cards to choose your opening monster.`,'m']]);
  render(); beginDecision(); if (SERIES.bestOf>1) gameBanner();
}
function addLog(head, lines){ S.log.unshift({head, lines}); }

// ===================== decisions: each seat commits a face-down card; both committed → reveal =====================
let timed = () => S && S.ctrl==='gm';     // v0.5: timer only when a human (GM) controls the NPC seat
let TICK=null, AITIMER=null;
function beginDecision(){
  if (S.ctrlQueued){ S.ctrl=S.ctrlQueued; S.ctrlQueued=null; S.takeovers++;
    addLog('CONTROL',[[S.ctrl==='gm'?'The GM takes control of the NPC from this decision.':'The NPC returns to AI control from this decision.','m']]); }
  S.commit=[null,null]; clearDrafts(); UI.seat=0;
  clearInterval(TICK); clearTimeout(AITIMER); S.deadline=null;
  if (S.ctrl==='ai'){            // AI decides from public info only, after a short "thinking" pause, then places face down
    AITIMER=setTimeout(()=>{ if (!S||S.phase==='ended') return;
      const c = S.phase==='opening' ? { replace: aiOpening(S.p[1], S.prof) } : S.phase==='replace' ? { replace: aiChoose(S.p[1], S.p[0], S.prof).replace } : aiChoose(S.p[1], S.p[0], S.prof);
      commit(1, c); }, 700+Math.random()*1300);
  }
  if (S.phase==='replace') for (const s of [0,1]) if (!S.p[s].pending){ S.commit[s]={skip:true}; if (s===1) clearTimeout(AITIMER); }
  if (S.phase==='replace' && S.commit[UI.seat] && !S.commit[1-UI.seat] && S.ctrl==='gm') UI.seat=1-UI.seat;
  if (timed()){ S.deadline=Date.now()+CFG.TIMER*1000; TICK=setInterval(tickTimer, 250); }
  render();
}
function tickTimer(){
  if (!S || !S.deadline) return clearInterval(TICK);
  const left=Math.max(0, S.deadline-Date.now()); drawFuse();
  if (left<=0){ clearInterval(TICK); S.deadline=null;
    for (const s of [0,1]) if (!S.commit[s]){ S.timeouts++;
      const pl=S.p[s]; const c = (S.phase==='opening'||S.phase==='replace') ? { replace:autoPickMonster(pl) } : { action:'PASS', replace: pl.pending?autoPickMonster(pl):undefined };
      addLog('TIMEOUT',[[`${seatName(s)} ran out of time: ${S.phase==='opening'?'opening monster auto-picked':S.phase==='replace'?'replacement auto-picked (highest HP)':'auto-Pass'}.`,'m']]);
      commit(s, c); }
  }
}
function canLock(){ const me=S.p[UI.seat]; if (S.commit[UI.seat]) return false;
  if (S.phase==='opening' || S.phase==='replace') return UI.replace!=null;
  if (!UI.sel) return false; if (me.pending&&UI.replace==null) return false; if (UI.sel==='SWITCH'&&UI.target==null) return false; return true; }
function lockFromUI(fromRect){
  if (UI.busy||!canLock()) return;
  const c = (S.phase==='opening'||S.phase==='replace') ? { replace:UI.replace } : { action:UI.sel, target:UI.target };
  const s=UI.seat; commit(s, c, fromRect);
  if (S.ctrl==='gm' && !S.commit[1-s] && S.phase!=='anim') { UI.seat=1-s; render(); }   // hot-seat: hand over to the other side
}
async function commit(s, c, fromRect){
  if (S.commit[s] || S.phase==='anim' || S.phase==='ended') return;
  if (c.skip){ S.commit[s]=c; return; }
  S.flying=S.flying||[false,false]; if (S.flying[s]) return; S.flying[s]=true;
  // the card travels from that side's hand (or from where it was dropped) to its action slot, face down
  if (!fromRect){ const hd=$('#hand'+s), sel=s===UI.seat && $(`#hand${s} .hcard.sel`); const r=(sel||hd) && (sel||hd).getBoundingClientRect(); if (r) fromRect = sel ? r : { left:r.left+r.width/2-30, top:r.top, width:60, height:84 }; }
  updateField();
  if (s===UI.seat && c.action){ const hc=document.querySelector(`#hand${s} [data-hand="${c.action}"]`); if (hc) hc.style.visibility='hidden'; }   // the played card leaves the hand at once
  await flyTo(fromRect, s);
  S.flying[s]=false; if (S.commit[s] || S.phase==='anim' || S.phase==='ended') return;
  S.commit[s]=c; S.justPlaced=null; sfx('book', 0.9, 0);      // Book1 = a card is played face down
  if (S.commit[0] && S.commit[1]) { clearInterval(TICK); S.deadline=null; S.phase==='opening' ? revealOpening() : S.phase==='replace' ? revealReplacement() : revealRound(); }
  else render();
}
async function revealOpening(){
  UI.busy=true; const [a,b]=S.commit;
  S.reveal={ a:[N(S.p[0].roster[a.replace].cid),'opening',ART[S.p[0].roster[a.replace].cid]], b:[N(S.p[1].roster[b.replace].cid),'opening',ART[S.p[1].roster[b.replace].cid]], open:false };
  S.phase='anim'; render(); await sleep(450); S.reveal.open=true; renderLane(); await sleep(700);
  S.p[0].active=a.replace; S.p[1].active=b.replace;
  updateField(); await sleep(900);
  addLog('OPENING',[[`You open with ${N(S.p[0].roster[S.p[0].active].cid)}. ${seatName(1)} opens with ${N(S.p[1].roster[S.p[1].active].cid)}.`,'']]);
  S.round=1; S.phase='choose'; S.reveal=null; UI.busy=false; beginDecision();
}
async function revealReplacement(){
  UI.busy=true; const C=S.commit, P=S.p;
  const face = s => C[s].skip ? ['—','no change',null] : [N(P[s].roster[C[s].replace].cid), 'replacement', ART[P[s].roster[C[s].replace].cid]];
  S.reveal={ a:face(0), b:face(1), open:false };
  S.phase='anim'; render(); await sleep(400); S.reveal.open=true; renderLane(); await sleep(650);
  const L=[];
  for (const s of [0,1]) if (!C[s].skip){ P[s].active=C[s].replace; P[s].pending=false; S.stats.forced[s]++; L.push([`${seatName(s)} send${s?'s':''} in ${N(P[s].roster[P[s].active].cid)}.`,'m']); }
  updateField(); await sleep(850);
  addLog('REPLACEMENT', L);

}
async function revealRound(){
  UI.busy=true; const [mine,npc]=S.commit;
  const sub=(s,c)=> c.action==='SWITCH' ? `→ ${N(S.p[s].roster[c.target].cid)}` : (ITEMS[c.action]?ITEMS[c.action].k:'');
  const artOf=(s,c)=> c.action==='SWITCH' ? ART[S.p[s].roster[c.target].cid] : ITEMS[c.action] ? ART[ITEMS[c.action].art] : null;
  S.reveal={ a:[ACT_T[mine.action], sub(0,mine), artOf(0,mine)], b:[ACT_T[npc.action], sub(1,npc), artOf(1,npc)], open:false };
  S.phase='anim'; render();
  await sleep(450); S.reveal.open=true; renderLane(); await sleep(800);
  const before=S.p.map(pl=>pl.roster.map(m=>m.hp));
  const r=resolveRound([mine,npc]);

function endMatch(){
  if (SERIES){ if (S.result==='WIN') SERIES.wins[0]++; else if (S.result==='LOSS') SERIES.wins[1]++; else SERIES.draws++;
    SERIES.over = SERIES.wins[0]>=SERIES.need || SERIES.wins[1]>=SERIES.need; S.series={...SERIES, wins:[...SERIES.wins]}; }
  setTimeout(()=>finishBanner(), 380);
  S.phase='ended'; S.t1=Date.now(); clearInterval(TICK); clearTimeout(AITIMER); S.deadline=null;
  document.querySelectorAll('.downed').forEach(e=>e.classList.remove('downed'));
  const X=SESSION; X.matches++; X.rounds+=S.round; X.roundList.push(S.round); X.ms+=S.t1-S.t0;
  if (S.result==='WIN') X.wins++; else if (S.result==='LOSS') X.losses++; else X.draws++;
  if (S.capEnd){ X.capEnds++; if (S.result==='DRAW') X.capDraws++; }

  for (const s of [0,1]) X.itemsLeft+=Object.values(S.p[s].items).reduce((a,b)=>a+b,0);
  for (const [k,v] of Object.entries(S.stats.aff)){ X.aff[k]=X.aff[k]||[0,0]; X.aff[k][0]+=v[0]; X.aff[k][1]+=v[1]; }

  const ws = S.result==='WIN'?0:S.result==='LOSS'?1:null;

  X.comps=X.comps||{}; X.picks=X.picks||{};
  for (const s of [0,1]){ const ids=S.p[s].roster.map(m=>m.cid); const k=compKey(ids); const c=X.comps[k] ||= {n:0,w:0,l:0,d:0}; c.n++; if (ws==null) c.d++; else if (s===ws) c.w++; else c.l++; }

  if (S.stats.mutualFinal) X.mutualFinal=(X.mutualFinal||0)+1; if (S.stats.tiebroken) X.tiebroken=(X.tiebroken||0)+1;
  if (S.stats.frost){ X.frost=X.frost||[0,0]; X.frost[0]+=S.stats.frost[0]; X.frost[1]+=S.stats.frost[1]; }
  if (S.stats.cafe){ X.cafe=X.cafe||{used:0,changed:0,capped:0}; for (const k in S.stats.cafe) X.cafe[k]+=S.stats.cafe[k]; }
  X.firstStrike=(X.firstStrike||0)+(S.stats.firstStrike||0); X.timeouts=(X.timeouts||0)+S.timeouts; X.takeovers=(X.takeovers||0)+S.takeovers;

  addLog('MATCH OVER',[[t+(S.result==='WIN'&&S.prize?` You take ${N(S.prize)} as your prize card.`:''), S.result==='WIN'?'g':S.result==='LOSS'?'k':'m']]);
}

(function fxTip(){

  let cur=null;

    const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
    let x=r.left+r.width/2-w/2, y=r.top-h-8; if (y<6) y=r.bottom+8; x=Math.max(6, Math.min(window.innerWidth-w-6, x));

  const hide=()=>{ cur=null; tip.classList.remove('on'); };

async function fxClash(ev){
  const att=[0,1].filter(s=>ev.res[s]); if (!att.length) return;
  const L=$('#fxl'), table=$('#table');
  const slots=[0,1].map(s=>$(`#slot${s}_${S.p[s].active}`));
  const c=[0,1].map(s=>centerOf(slots[s],L));
  const dy=c[0].y-c[1].y, dx=c[0].x-c[1].x;
  const both=att.length===2; const dur=RM()?60:950;
  setTimeout(()=>sfx('swing',0.7), dur*0.3);
  const anims=[];
  for (const s of [0,1]){
    const sign = s===0 ? -1 : 1; // toward the other side
    const charging = !!ev.res[s];
    const reach = both ? 0.5 : (charging ? 0.82 : 0);
    const tx = (s===0?-dx:dx)*reach*0.5, ty = sign*Math.abs(dy)*reach - sign*(both?28:40)*(reach?1:0);
    const base = slots[s].classList.contains('fwd') ? (s===0?'translateY(-22px) scale(1.08)':'translateY(16px) scale(1.08)') : '';
    slots[s].style.zIndex=10;
    if (charging){
      anims.push(slots[s].animate([
        {transform:`${base}`},
        {transform:`${base} translate(0px,${-sign*22}px) scale(.94) rotate(${sign*-3}deg)`, offset:.35},
        {transform:`${base} translate(${tx}px,${ty}px) scale(1.05)`, offset:.58, easing:'cubic-bezier(.6,0,1,1)'},
        {transform:`${base} translate(${tx*0.9}px,${ty*0.9}px) scale(1.02)`, offset:.66},
        {transform:`${base}`}
      ],{duration:dur, easing:'ease-out'}));
    } else {
      anims.push(slots[s].animate([{transform:base},{transform:base,offset:.58},{transform:`${base} translate(0,${-sign*-14}px) rotate(${sign*4}deg)`,offset:.68},{transform:base}],{duration:dur}));
    }
  }
  await sleep(dur*0.58);
  // impact point
  let ix, iy;
  if (both){ ix=(c[0].x+c[1].x)/2; iy=(c[0].y+c[1].y)/2; }
  else { const d=att[0]===0?1:0; const sc=spriteCenter(d); ix=sc.x; iy=sc.y+10; }
  const colors=att.map(s=>ev.res[s].aff==='NONE'?'#ffffff':`var(--e-${CARDS[ev.res[s].a.cid].el})`);
  add('flash',ix,iy,{'--pc':colors[0]});
  add('ring',ix,iy,{'--pc':colors[colors.length-1]});
  for (let k=0;k<12;k++){ add('ray',ix-2,iy-44,{'--pc':colors[k%colors.length],transform:`rotate(${k*30+Math.random()*12}deg)`}); }
  particles(ix,iy,26,colors[0],{r:90}); if (colors[1]) particles(ix,iy,18,colors[1],{r:80});
  table.classList.remove('shake'); void table.offsetWidth; table.classList.add('shake');
  sfx('hit', 0.9, 0); for (const s of att){ const r=ev.res[s]; if (r.aff!=='NONE' && !r.usedAbsorb) sfx(HITSND[CARDS[r.a.cid].el]||'hit', 0.8, 0); else if (r.aff==='NONE') sfx('shard',0.6,0); }
  for (const s of [0,1]){ const b=$('#barrier'+s); const r=ev.res[1-s]; if (b&&r){ b.classList.add(r.pierced?'shatter':'crack'); sfx(r.pierced?'shatter':'parry',0.8,0); } }
  await Promise.all(anims.map(a=>a.finished.catch(()=>{})));
  slots.forEach(e=>{ e.style.zIndex=''; });
}

function popFor(s, r){   // popup on defender side s for attack r
  if (r.heal){ popNum(s,'+'+(r.healed||0),'heal','Absorb'); sfx('absorb',0.9,0); }
  else popNum(s, r.dmg?('−'+r.dmg):'0', r.dmg?'dmg':'zero', r.aff==='ADV'?'Strong':r.aff==='DIS'?'Weak':r.aff==='NONE'?'Elementless':'');
}
async function playRound(ev, before){
  // 1. monster changes: show new actives (holograms summon)
  // temporarily display pre-resolution HP/KO
  for (const s of [0,1]) for (const m of S.p[s].roster){ m._hp=m.hp; m._ko=m.ko; m.hp=before[s][m.i]; m.ko=before[s][m.i]<=0; }
  updateField();
  if (ev.enter[0]||ev.enter[1]) await sleep(900);
  // 2. items
  const it=[0,1].filter(s=>ev.items[s]);
  await Promise.all(it.map(s=>fxItem(s, ev.items[s])));
  if (it.length) await sleep(450);
  for (const s of [0,1]) if (ev.heal[s]){ const m=mon(S.p[s],S.p[s].active); m.hp=Math.min(CARDS[m.cid].hp, m.hp+ev.heal[s]); setHP(s,m.i,m.hp); popNum(s,'+'+ev.heal[s],'heal','Remedy'); }
  if (ev.heal[0]||ev.heal[1]) await sleep(550);
  // 3. clash: simultaneous when Speed ties, otherwise one strike at a time (faster first)
  if (ev.seq){
    for (let k=0;k<ev.seq.length;k++){
      const s=ev.seq[k], one={res:[null,null]}; one.res[s]=ev.res[s];
      await fxClash(one); popFor(1-s, ev.res[s]);
      const sn=ev.snaps[k]; for (const q of [0,1]) setHP(q, S.p[q].active, sn[q]);
      if (k<ev.seq.length-1) await sleep(420);
    }
    if (ev.denied!=null){ const d=$(`#slot${ev.denied}_${S.p[ev.denied].active}`); if (d){ d.classList.add('downed'); } await sleep(250); }
  } else {
    await fxClash(ev);
    for (const s of [0,1]){ const r=ev.res[1-s]; if (r) popFor(s, r); }
  }
  // restore true state
  for (const s of [0,1]) for (const m of S.p[s].roster){ m.hp=m._hp; m.ko=m._ko; delete m._hp; delete m._ko; }
  updateField();
  await sleep(500);
  for (const s of [0,1]) for (const [k,v] of ev.after[s]) if (k==='heal') popNum(s,'+'+v,'heal');
  if (ev.after[0].length||ev.after[1].length) await sleep(600);
  if (ev.ko[0]||ev.ko[1]){ sfx('ko',0.9,0); for (const s of [0,1]) if (ev.ko[s]){ const sc=centerOf($(`#slot${s}_${S.p[s].active}`),$('#fxl')); particles(sc.x,sc.y-30,30,'#ff6f6f',{r:70}); } await sleep(700); }
  else await sleep(300);
}

    // the same buttons as the result screen, so "View the board" never strands anyone
    const E = endButtons();
    const btns = E.btns.map(b => `<button class="btn ${b.go ? 'go' : ''}" type="button" id="e${b.id}" ${b.disabled ? 'disabled' : ''}>${esc(b.label)}</button>`).join('');
    return `<div class="win end"><h2>${t}</h2>${score}<div>${why}${S.capEnd ? 'Round limit reached. ' : ''}${S.tiebreak ? `Both last monsters fell together; decided on HP before impact (${S.tiebreak[0]} vs ${S.tiebreak[1]}). ` : ''}</div>${reward}
      ${E.note ? `<div style="margin-top:6px"><b>${esc(E.note)}</b></div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">${btns}</div></div>`;
  };
  bindEnd = function(){
    for (const b of endButtons().btns){ const el = document.getElementById('e' + b.id); if (el && b.act) el.onclick = () => { sfx(b.cancel ? 'cancel' : 'cursor'); b.act(); }; }
  };

  // ---------- sounds + music from Forge (sound effects first; theme = intro once, then a gapless loop) ----------
  let musicUrls = (typeof FA_BGM !== 'undefined') ? FA_BGM : null, musicLoading = false, sfxLoading = false;
  const fetchBuf = async u => SND.ctx.decodeAudioData(await (await fetch(u)).arrayBuffer());
  async function trySfx(){
    if (sfxLoading || !SND.ctx || typeof SFXURL === 'undefined') return; sfxLoading = true;
    await Promise.all(Object.entries(SFXURL).map(async ([k, u]) => { if (SND.buf[k]) return; try { SND.buf[k] = await fetchBuf(u); } catch (e) { console.warn('[Fabula Arcana duel] sfx', k, e); } }));
  }
  async function tryMusic(){
    trySfx();
    if (!musicUrls || musicLoading || !SND.ctx || MUS.buf.loop || !MUS.on) return;
    musicLoading = true;
    try { for (const k of ['intro','loop']) if (musicUrls[k]) MUS.buf[k] = await fetchBuf(musicUrls[k]);
      musicStart(); } catch (e) { console.warn('[Fabula Arcana duel] music', e); }
    musicLoading = false;
  }
  window.tryMusicNet = () => tryMusic();
  document.addEventListener('pointerdown', () => setTimeout(tryMusic, 60), { capture:true });
  document.addEventListener('keydown', () => setTimeout(tryMusic, 60), { capture:true });

  // ---------- inbound messages ----------
  async function handle(m){
    switch (m.t){
      case 'init':
        NET.role = m.role || 'player'; NET.myName = m.myName || 'You'; NET.oppName = m.oppName || 'Opponent'; NET.names = m.names || null;
        NET.lobby = m.lobby || null; NET.ready = !!m.ready; NET.spectators = m.spectators || 0;
        if (m.vol){ SND.vol = 0.55 * (m.vol.sfx ?? 1); MUS.vol = 0.32 * (m.vol.music ?? 1); }
        if (m.music){ musicUrls = m.music; tryMusic(); }
        if (NET.lobby && NET.lobby.suggest && !(UI.pick || []).length) UI.pick = NET.lobby.suggest.slice();
        NET.rematch = { me:false, opp:false, oppLeft:false }; NET.nextSent = false;
        if (m.view) return m.view.phase === 'ended' ? applyState(m) : start(m);
        document.querySelectorAll('.ovl, .annc').forEach(o => o.remove());
        S = null; SERIES = null; render(); return;
      case 'lobby': {
        const was = !!(NET.lobby && NET.lobby.oppReady);
        NET.lobby = { ...(NET.lobby || {}), ...m.lobby };
        if (!was && NET.lobby.oppReady){ NET.oppPop = true; sfx('decide', 0.7, 0); }
        if (!S) render(); return;
      }
      case 'rematch': {
        NET.rematch = { me: !!m.me, opp: !!m.opp, oppLeft: !!m.oppLeft };
        if (m.opp && !m.me && !m.oppLeft) sfx('decide', 0.7, 0);
        fillEndButtons(); if (S && S.phase === 'ended') renderPicker(); return;
      }
      case 'banner': return announce(m.text || '', { sub: m.sub, tone: m.tone, ms: m.ms });
      case 'start': return start(m);
      case 'committed': return opponentCommitted(m.seat);
      case 'reveal': return reveal(m);
      case 'state': return applyState(m);
      case 'spectators': NET.spectators = m.n || 0; if (S) renderSidebar(); return;
      case 'toast': { const st = $('#status'); if (st) st.textContent = m.text || ''; return; }
    }
  }
  const queue = []; let busy = false;
  async function pump(){ if (busy) return; busy = true; while (queue.length){ const m = queue.shift(); try { await handle(m); } catch (e) { console.error('[Fabula Arcana duel]', e); } } busy = false; }
  window.FA_NET = { receive(m){ queue.push(m); pump(); } };
  render();
  send({ t:'hello' });
})();

</script>
